<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSP2D - 主菜单</title>
    <style>
        /* ==================== 设计 tokens（与 play-main.html 同一套） ==================== */
        :root {
            --panel: rgba(10, 16, 28, .82);
            --line: #2a3f5f;
            --line-soft: rgba(42, 63, 95, .55);
            --blue: #4a90d9;
            --amber: #ffc35c;
            --text: #dce8f7;
            --dim: #6b86a6;
            --mono: ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
            --sans: 'Segoe UI', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --shadow: 0 2px 16px rgba(0, 0, 0, .35);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #05070d; color: var(--text); font-family: var(--sans);
            -webkit-tap-highlight-color: transparent;
        }
        /* 极淡的坐标点阵，给黑底一点「任务控制台」的质感 */
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none;
            background-image: radial-gradient(rgba(124, 160, 205, .13) 1px, transparent 1.5px);
            background-size: 30px 30px;
        }
        header { text-align: center; margin-bottom: 44px; position: relative; }
        h1 {
            margin: 0; font-size: 54px; font-weight: 600;
            letter-spacing: 18px; padding-left: 18px;   /* 抵消最后一个字母的间距，保持视觉居中 */
            color: var(--text);
        }
        header .rule { width: 220px; height: 1px; background: var(--line); margin: 18px auto 0; }
        .menu-row {
            display: flex; flex-direction: column; gap: 12px; position: relative;
            width: min(300px, calc(100vw - 40px));
        }
        .btn {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
            color: var(--text); font-size: 16px; letter-spacing: 3px; text-decoration: none;
            box-shadow: var(--shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: border-color .2s, background .2s;
        }
        .btn::after {
            content: ''; width: 7px; height: 7px; flex: none;
            border-top: 1.5px solid var(--dim); border-right: 1.5px solid var(--dim);
            transform: rotate(45deg);
        }
        .btn:hover { border-color: var(--blue); background: rgba(74, 144, 217, .1); }
        .btn:hover::after { border-color: var(--blue); }
        .btn:active { background: rgba(74, 144, 217, .18); }
        #ship-line {
            margin-top: 34px; color: var(--dim); font-size: 13px;
            font-family: var(--mono); letter-spacing: 1px;
            position: relative; text-align: center; padding: 0 20px;
        }
        #bgm-hint {
            position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            color: var(--dim); font-size: 12px; font-family: var(--mono);
            letter-spacing: 1px; pointer-events: none; opacity: .8; white-space: nowrap;
        }
    </style>
</head>
<body>
    <header>
        <h1>MSP-2D</h1>
        <div class="rule"></div>
    </header>
    <div class="menu-row">
        <a href="build.html" class="btn">造 船 厂</a>
        <a href="station.html" class="btn">观 察 站</a>
        <a href="play-main.html" class="btn">开始游戏</a>
    </div>
    <div id="ship-line">当前飞船：读取中...</div>
    <div id="bgm-hint">音乐加载中...</div>

    <script>
        // ==================== 背景音乐：miaosic / Higher ====================
        const bgm = new Audio('miaosic/BGM-Higher.mp3');
        bgm.loop = true;
        bgm.volume = 0.45;

        let bgmMuted = false;
        try { bgmMuted = localStorage.getItem('msp2d-bgm-muted') === '1'; } catch (e) {}

        function startBgm() {
            if (bgmMuted) return;
            try {
                const p = bgm.play();
                if (p && p.catch) p.catch(() => {});   // 浏览器不让自动播放就先算了
            } catch (e) {}
        }

        // 浏览器规定：必须先有用户操作（点击 / 按键）才允许放声音
        window.addEventListener('pointerdown', startBgm);
        window.addEventListener('keydown', startBgm);
        startBgm();   // 有些浏览器允许直接播，先试一次

        function updateBgmHint() {
            const el = document.getElementById('bgm-hint');
            if (!el) return;
            el.innerText = bgmMuted ? '音乐：关（按 M 打开）' : '音乐：开（按 M 关闭）';
        }

        function toggleBgm() {
            bgmMuted = !bgmMuted;
            try { localStorage.setItem('msp2d-bgm-muted', bgmMuted ? '1' : '0'); } catch (e) {}
            if (bgmMuted) {
                bgm.pause();
            } else {
                bgm.volume = 0.45;
                startBgm();
            }
            updateBgmHint();
        }

        window.addEventListener('keydown', (e) => { if (e.code === 'KeyM') toggleBgm(); });

        // ==================== 显示当前飞船 ====================
        (async function showShip() {
            const el = document.getElementById('ship-line');
            let ship = null;
            try {
                const r = await fetch('/api/ship');
                const d = await r.json();
                if (d && d.ship) ship = d.ship;
            } catch (e) { /* 没服务器就读本地的 */ }
            if (!ship) {
                try {
                    const raw = localStorage.getItem('msp2d-ship');
                    if (raw) ship = JSON.parse(raw);
                } catch (e) {}
            }
            if (!ship || !Array.isArray(ship.parts) || ship.parts.length === 0) {
                el.innerText = '还没造船　→　去造船厂造一艘';
                return;
            }
            const n = { capsule: 0, tank: 0, engine: 0 };
            let mass = 0, thrust = 0, fuel = 0;
            for (const p of ship.parts) {
                if (p.type === 'capsule') { n.capsule++; mass += 30; }
                if (p.type === 'tank') { n.tank++; mass += 20; fuel += 40; }
                if (p.type === 'engine') { n.engine++; mass += 25; thrust += 1000; }
            }
            el.innerText = '当前飞船：' + (ship.name || '无名')
                + '　|　控制舱 ' + n.capsule + '　燃料箱 ' + n.tank + '　发动机 ' + n.engine
                + '　|　质量 ' + (mass + fuel) + '　推力 ' + thrust;
        })();
        if (bgmMuted) bgm.volume = 0;
        updateBgmHint();
    </script>
</body>
</html>
