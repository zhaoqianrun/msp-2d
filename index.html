<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSP2D - 主菜单</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1a1a3a 0%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
        }
        h1 {
            font-size: 80px;
            letter-spacing: 10px;
            text-shadow: 0 0 20px #4a90d9, 0 0 40px #4a90d9;
            margin-bottom: 50px;
            animation: pulse 3s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        .btn {
            padding: 15px 50px;
            font-size: 24px;
            background: transparent;
            color: #4a90d9;
            border: 2px solid #4a90d9;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn:hover {
            background: #4a90d9;
            color: #fff;
            box-shadow: 0 0 30px #4a90d9;
        }
        #bgm-hint {
            position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            color: #4a6a8a; font-size: 13px; font-family: monospace;
            letter-spacing: 1px; pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>MSP-2D</h1>
    <a href="play-main.html" class="btn">开始游戏</a>
    <div id="bgm-hint">音乐加载中...</div>

    <script>
        // ==================== 背景音乐：miaosic / Higher ====================
        const bgm = new Audio('miaosic/BGM-Higher.mp3');
        bgm.loop = true;
        bgm.volume = 0.45;

        let bgmMuted = false;
        try { bgmMuted = localStorage.getItem('msp2d-bgm-muted') === '1'; } catch (e) {}

        function startBgm() {
            if (bgmMuted) return;
            try {
                const p = bgm.play();
                if (p && p.catch) p.catch(() => {});   // 浏览器不让自动播放就先算了
            } catch (e) {}
        }

        // 浏览器规定：必须先有用户操作（点击 / 按键）才允许放声音
        window.addEventListener('pointerdown', startBgm);
        window.addEventListener('keydown', startBgm);
        startBgm();   // 有些浏览器允许直接播，先试一次

        function updateBgmHint() {
            const el = document.getElementById('bgm-hint');
            if (!el) return;
            el.innerText = bgmMuted ? '音乐：关（按 M 打开）' : '音乐：开（按 M 关闭）';
        }

        function toggleBgm() {
            bgmMuted = !bgmMuted;
            try { localStorage.setItem('msp2d-bgm-muted', bgmMuted ? '1' : '0'); } catch (e) {}
            if (bgmMuted) {
                bgm.pause();
            } else {
                bgm.volume = 0.45;
                startBgm();
            }
            updateBgmHint();
        }

        window.addEventListener('keydown', (e) => { if (e.code === 'KeyM') toggleBgm(); });
        if (bgmMuted) bgm.volume = 0;
        updateBgmHint();
    </script>
</body>
</html>
