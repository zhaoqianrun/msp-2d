<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSP2D - 猫咪航天局</title>
    <link rel="stylesheet" href="ui/shared.css">
    <style>
        /* 设计 tokens 在 ui/shared.css（唯一事实源），本页只留布局与组件皮肤 */
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        /* 画布铺满整个窗口：宇宙必须填满屏幕，按钮和 HUD 浮在它上面。 */
        body { margin: 0; background: var(--bg); height: 100vh; overflow: hidden; position: relative;
               font-family: var(--sans); color-scheme: dark; }
        /* 画布自适应：手机上自动缩放到装得下，触控不要触发滚动/双指缩放 */
        canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; display: block;
            border: none; touch-action: none;
        }

        /* ==================== 左上：飞行数据面板 + 部件栏 ==================== */
        #top-left {
            position: absolute; top: 10px; left: 10px;
            z-index: 5; pointer-events: none;
            display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
        }
        /* 分级堆栈面板（KSP 式，自底向上；:empty 自动隐藏） */
        #stage-stack {
            position: absolute; left: 14px; bottom: 385px;
            display: flex; flex-direction: column; gap: 4px;
            font-family: var(--mono); font-size: 11px;
            pointer-events: none;
        }
        #stage-stack:empty { display: none; }
        #stage-stack .stg {
            background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
            padding: 3px 9px; color: var(--dim);
            display: flex; align-items: center; gap: 8px;
        }
        #stage-stack .stg .stg-n {
            font-weight: 600; color: var(--text); min-width: 14px; text-align: center;
        }
        #stage-stack .stg.next {
            border-color: var(--amber); color: var(--amber);
        }
        #stage-stack .stg.done { opacity: .38; text-decoration: line-through; }

        /* 飞行数据 HUD：经典终端风文本块（js/main.js 写 innerText，按信息
           层级分行；宽度自适应、超长自动折行不丢字） */
        #hud {
            color: #0f0;
            font-family: ui-monospace, Consolas, 'Courier New', monospace;
            font-size: 13px; line-height: 1.6;
            text-shadow: 1px 1px 2px #000;
            white-space: pre-wrap; word-break: break-all;
            width: clamp(300px, calc(100vw - 470px), 560px);
        }
        #hud:empty { display: none; }

        /* ==================== 部件栏 ==================== */
        /* 跟在数据面板下面；chips 由 js/main.js 生成（class 名固定） */
        #parts-bar {
            pointer-events: none; white-space: nowrap;
            width: max-content; max-width: min(720px, calc(100vw - 20px));
            display: flex; align-items: center; gap: 5px;
            font-family: var(--sans); font-size: 12px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
            box-shadow: var(--shadow);
            background-image: var(--scan);           /* 数据读出面：2% 扫描线材质 */
            padding: 6px 10px;
            overflow-x: auto; scrollbar-width: none;
        }
        #parts-bar::-webkit-scrollbar { display: none; }
        #parts-bar .p {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 2px 8px; border-radius: 3px;
            border: 1px solid; line-height: 1.5; font-size: 11.5px;
        }
        #parts-bar .p .dot { width: 7px; height: 7px; border-radius: 50%; }
        #parts-bar .p .hp { font-family: var(--mono); font-size: 10px; opacity: .75; }
        /* 完好 */
        #parts-bar .ok { color: #9fd8ae; border-color: rgba(69, 196, 110, .45); background: rgba(69, 196, 110, .08); }
        #parts-bar .ok .dot { background: var(--green); }
        /* 受损 */
        #parts-bar .hurt { color: var(--amber); border-color: rgba(255, 195, 92, .45); background: rgba(255, 195, 92, .07); }
        #parts-bar .hurt .dot { background: #e0a020; }
        /* 正在烧 */
        #parts-bar .hot { color: #ffb37a; border-color: rgba(255, 106, 26, .5); background: rgba(255, 106, 26, .08);
                          animation: pulse .7s ease-in-out infinite; }
        #parts-bar .hot .dot { background: #ff6a1a; }
        /* 已毁 */
        #parts-bar .gone { color: #5d5560; border-color: rgba(93, 85, 96, .5); background: rgba(93, 85, 96, .1);
                           text-decoration: line-through; opacity: .75; }
        #parts-bar .gone .dot { background: #4a3a40; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
        #parts-bar .summary {
            color: #8fb4dc; padding-left: 8px; margin-left: 2px;
            border-left: 1px solid var(--line-soft);
        }
        #parts-bar .warn { color: var(--red); font-weight: 600; }

        /* ==================== 右上：时间倍率胶囊 + 系统按钮 ==================== */
        #top-buttons {
            position: absolute; top: 10px; right: 10px; z-index: 6;
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
            pointer-events: none;
        }
        #top-buttons > * { pointer-events: auto; }
        /* 时间倍率：分段仪表（− │ 档位+刻度条 │ +），方角 */
        #time-btn {
            display: flex; align-items: stretch; gap: 0;
            padding: 0; background: var(--panel); border: 1px solid var(--line);
            border-radius: 3px; box-shadow: var(--shadow);
            overflow: hidden;
        }
        #time-btn button {
            width: 30px; border: none; background: transparent;
            color: var(--dim); font-size: 15px; font-family: var(--mono);
            border-radius: 0; cursor: pointer;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        #time-btn button:first-child { border-right: 1px solid var(--line-dim); }
        #time-btn button:last-child  { border-left: 1px solid var(--line-dim); }
        #time-btn button:hover { background: rgba(74, 144, 217, .18); color: var(--text); }
        #time-btn button:active { background: rgba(74, 144, 217, .3); }
        #time-value {
            min-width: 58px; padding: 3px 0 2px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: var(--mono); font-size: 13px; font-weight: 600;
            color: var(--text);
        }
        /* 档位刻度条：6 小格（当前档位由 fast/ultra 配色表达） */
        #time-value::after {
            content: ''; width: 34px; height: 2px; margin-top: 2px;
            background: repeating-linear-gradient(90deg, var(--line-strong) 0 4px, transparent 4px 7px);
        }
        /* 加速档位提示：fast = 中速档，ultra = 极速档 */
        #time-value.fast { color: var(--amber); }
        #time-value.fast::after { background: repeating-linear-gradient(90deg, rgba(255, 195, 92, .6) 0 4px, transparent 4px 7px); }
        #time-value.ultra { color: var(--red); }
        #time-value.ultra::after { background: repeating-linear-gradient(90deg, rgba(255, 106, 106, .6) 0 4px, transparent 4px 7px); }
        #time-value.ultra { animation: pulse .9s ease-in-out infinite; }
        /* 系统按钮：一行紧凑图标 + 文字 */
        .sys-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 72vw; }
        .sys-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 11px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 3px; color: var(--text); font-family: var(--sans); font-size: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        .sys-btn svg {
            width: 13px; height: 13px; flex: none;
            stroke: var(--dim); fill: none; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .sys-btn:hover { border-color: var(--blue); }
        .sys-btn:hover svg { stroke: var(--blue); }
        .sys-btn:active { background: rgba(74, 144, 217, .15); }

        /* ==================== 左右：油门 / 燃料 竖条 ==================== */
        #throttle-bar, #fuel-bar {
            position: absolute; bottom: 208px; width: 18px; height: 172px; z-index: 4;
            background: rgba(10, 14, 22, .72);
            border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
        }
        #throttle-bar { left: 16px; }
        #fuel-bar { right: 16px; }
        /* 刻度线（每 1/4 一格），盖在填充上面 */
        #throttle-bar::after, #fuel-bar::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(to top,
                transparent 0 42px, rgba(220, 232, 247, .16) 42px 43px);
        }
        /* 填充高度/颜色由 js/main.js 直接写内联样式，这里只给默认色 */
        #throttle-fill {
            position: absolute; left: 0; bottom: 0; width: 100%; height: 100%;
            background: var(--amber); opacity: .9;
        }
        #fuel-fill {
            position: absolute; left: 0; bottom: 0; width: 100%; height: 100%;
            background: var(--blue); opacity: .9;
        }
        #throttle-text {
            position: absolute; left: 16px; bottom: 388px;
            color: var(--amber); font-family: var(--mono); font-size: 11px; letter-spacing: 2px;
        }
        #fuel-text {
            position: absolute; right: 16px; bottom: 388px; width: 300px;
            color: var(--text); font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
            text-align: right; white-space: pre-line; line-height: 1.6;
            font-variant-numeric: tabular-nums;
        }

        /* ==================== 成就横幅 + 成就面板 ==================== */
        #achievement {
            position: absolute; top: 22px; left: 50%;
            transform: translateX(-50%) translateY(-24px);
            padding: 10px 34px 12px; text-align: center; pointer-events: none;
            background: var(--panel-solid); border: 1px solid var(--line);
            border-top: 2px solid var(--amber); border-radius: 3px;
            box-shadow: var(--shadow);
            opacity: 0; transition: opacity .35s, transform .35s;
            white-space: nowrap; z-index: 10;
        }
        #achievement-title { color: var(--amber); font-size: 11px; letter-spacing: 6px; }
        #achievement-name { color: var(--text); font-size: 21px; font-weight: 600; letter-spacing: 2px; margin-top: 4px; }
        #achievement-desc { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
        #achievement-panel {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(640px, 94vw); max-height: 80%; overflow-y: auto;
            padding: 16px 22px; z-index: 11;
            background: var(--panel-solid); border: 1px solid var(--line); border-radius: 3px;
            box-shadow: var(--shadow); pointer-events: auto;
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
        }
        .ach-head {
            color: var(--blue); font-size: 13px; letter-spacing: .3em;
            margin-bottom: 10px; padding-bottom: 10px; text-align: center;
            border-bottom: 1px solid var(--line-dim);
            font-variant-numeric: tabular-nums;
        }
        .ach-row {
            display: flex; align-items: baseline; font-size: 13px;
            padding: 7px 2px; border-bottom: 1px solid rgba(42, 63, 95, .35);
        }
        .ach-row:last-child { border-bottom: none; }
        .ach-mark { width: 24px; flex: none; font-family: var(--mono); font-size: 11px; }
        .ach-name { width: 120px; flex: none; color: var(--text); }
        .ach-desc { flex: 1; color: var(--dim); }
        .ach-row.got .ach-mark { color: var(--green); }
        .ach-row.got .ach-desc { color: #9db4d0; }
        .ach-row.locked { color: #51637a; }
        .ach-row.locked .ach-name { color: #51637a; }

        /* ==================== 观战角标 ==================== */
        #spectator-badge {
            display: none; position: absolute; top: 50%; left: 20px;
            transform: translateY(-50%); z-index: 6;
            padding: 14px 7px; background: var(--panel);
            border: 1px solid rgba(255, 195, 92, .4); border-radius: 3px;
            box-shadow: var(--shadow); pointer-events: none;
            color: var(--amber); font-size: 13px; letter-spacing: 6px;
            writing-mode: vertical-rl;
        }

        /* ==================== 键位帮助（右下角 ? 展开，纯 CSS） ==================== */
        #controls-toggle { position: absolute; opacity: 0; pointer-events: none; }
        #controls-fab {
            position: absolute; right: 208px; bottom: 16px; z-index: 9;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            background: var(--panel); border: 1px solid var(--line); border-radius: 50%;
            box-shadow: var(--shadow);
            color: var(--dim); font-size: 15px; cursor: pointer; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #controls-fab:hover { color: var(--text); border-color: var(--blue); }
        #controls {
            position: absolute; right: 208px; bottom: 56px; z-index: 9;
            display: none; width: 336px; max-width: calc(100vw - 24px);
            padding: 14px 16px;
            background: var(--panel-solid); border: 1px solid var(--line); border-radius: 3px;
            box-shadow: var(--shadow); pointer-events: auto;
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
        }
        #controls-toggle:checked ~ #controls-fab { color: var(--text); border-color: var(--blue); background: rgba(74, 144, 217, .2); }
        #controls-toggle:checked ~ #controls { display: block; }
        #controls ul {
            list-style: none; margin: 0; padding: 0;
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px;
        }
        #controls li { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9db4d0; white-space: nowrap; }
        #controls li.span2 { grid-column: 1 / -1; }
        #controls kbd {
            font-family: var(--mono); font-size: 11px; color: var(--text);
            background: rgba(74, 144, 217, .12); border: 1px solid var(--line);
            border-bottom-width: 2px; border-radius: 2px; padding: 1px 6px; flex: none;
        }
        #controls .ctl-note {
            margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft);
            display: flex; align-items: center; gap: 8px;
            font-size: 11.5px; color: var(--dim); font-family: var(--mono);
        }
        #controls .ctl-note .dash { display: inline-block; width: 22px; border-top: 2px dashed var(--blue); }

        /* ==================== 触控按键（结构/位置固定，只换皮） ==================== */
        #touch-controls { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 8; }
        #touch-controls .pad { position: absolute; display: flex; gap: 8px; flex-wrap: wrap; width: 184px; }
        #touch-controls .pad-left { left: 12px; bottom: 12px; }
        #touch-controls .pad-right { right: 12px; bottom: 12px; justify-content: flex-end; }
        .tbtn {
            pointer-events: auto; touch-action: none;
            min-width: 86px; padding: 15px 14px;
            font-family: var(--sans); font-size: 14px; color: var(--text);
            background: rgba(10, 14, 22, .82);
            border: 1px solid var(--line); border-radius: 4px;
            box-shadow: var(--shadow);
            -webkit-tap-highlight-color: transparent;
            user-select: none; cursor: pointer;
        }
        .tbtn.small { min-width: 54px; padding: 9px 7px; font-size: 12px; color: var(--dim); }
        .tbtn.wide { flex: 1 1 100%; min-width: 0; }
        .tbtn.active { background: rgba(74, 144, 217, .9); border-color: #6ba6e0; color: #fff; }
        #t-ignite {
            padding: 17px 10px; font-size: 16px;
            border-color: rgba(255, 195, 92, .5); color: var(--amber);
            background: rgba(46, 32, 10, .8);
        }
        #t-ignite.active { background: var(--amber); border-color: var(--amber); color: #241a04; }

        /* ==================== ESC 暂停菜单（遮罩 + 菜单卡） ==================== */
        /* 列表按钮由 js/ui/pauseMenu.js 生成。hidden 控制显示，但下面的
           display:flex 会盖过 UA 的 [hidden] 规则，必须显式压回来 */
        #pause-menu {
            position: absolute; inset: 0; z-index: 12;
            display: flex; align-items: center; justify-content: center;
            background: rgba(3, 6, 12, .55);
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
        }
        #pause-menu[hidden] { display: none; }
        #pause-card {
            width: min(320px, calc(100vw - 32px));
            padding: 18px 20px 12px;
            background: var(--panel-solid); border: 1px solid var(--line); border-radius: 3px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
        }
        .pm-title {
            color: var(--text); font-size: 13px; letter-spacing: .35em; text-align: center;
            padding-bottom: 12px; margin-bottom: 10px;
            border-bottom: 1px solid var(--line-dim);
        }
        .pm-list { display: flex; flex-direction: column; gap: 6px; }
        .pm-btn {
            display: flex; align-items: center; justify-content: space-between;
            padding: 9px 12px; border: 1px solid var(--line); border-radius: 3px;
            background: rgba(74, 144, 217, .06); color: var(--text);
            font-family: var(--sans); font-size: 13.5px; letter-spacing: 2px;
            cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        .pm-btn:hover { border-color: var(--blue); background: rgba(74, 144, 217, .14); box-shadow: inset 2px 0 0 var(--amber); }
        .pm-btn:active { background: rgba(74, 144, 217, .22); }
        .pm-btn kbd {
            font-family: var(--mono); font-size: 11px; color: var(--text);
            background: rgba(74, 144, 217, .12); border: 1px solid var(--line);
            border-bottom-width: 2px; border-radius: 2px; padding: 1px 6px;
        }
        .pm-btn.danger { color: var(--red); border-color: rgba(255, 106, 106, .4); }
        .pm-btn.danger:hover { border-color: var(--red); background: rgba(255, 106, 106, .1); }
        .pm-note {
            margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-dim);
            color: var(--dim); font-size: 11px; font-family: var(--mono); letter-spacing: 1px; text-align: center;
        }

        /* ==================== 窄屏 / 矮屏 ==================== */
        @media (max-width: 760px) {
            /* 竖排按钮会占到 ~120px 高，数据面板往下让位 */
            #top-left { top: 124px; }
            .sys-btn { padding: 5px 9px; font-size: 11px; }
            .metric .val { font-size: 20px; }
        }
        @media (max-width: 460px) {
            #touch-controls .pad { width: 150px; gap: 6px; }
            .tbtn { min-width: 70px; padding: 11px 8px; font-size: 12px; }
            .tbtn.small { min-width: 44px; padding: 7px 3px; font-size: 11px; }
            #t-ignite { padding: 13px 8px; font-size: 15px; }
            .sys-row { max-width: calc(100vw - 20px); }
            #controls-fab, #controls { right: 174px; }
        }
        /* 屏幕矮的时候（横屏手机）：面板压紧，油门/燃料条挪到底部中间两侧，
           左右下角让给触控垫；键位帮助直接收起（触控用户用不到键盘） */
        @media (max-height: 620px) {
            #top-left { top: 96px; }
            #hud { font-size: 11px; line-height: 1.5; width: calc(100vw - 20px); }
            #stage-stack { display: none; }
            .sys-row { flex-wrap: nowrap; }
            #throttle-bar { left: calc(50% - 48px); bottom: 14px; height: 120px; }
            #fuel-bar { left: calc(50% + 28px); bottom: 14px; height: 120px; }
            #throttle-bar::after, #fuel-bar::after {
                background: repeating-linear-gradient(to top,
                    transparent 0 29px, rgba(220, 232, 247, .16) 29px 30px);
            }
            #throttle-text { left: calc(50% - 120px); width: 112px; text-align: right; bottom: 142px; }
            #fuel-text { left: calc(50% + 58px); right: auto; width: 260px; text-align: left; bottom: 142px; }
            #controls-fab, #controls { display: none; }
            .tbtn { min-width: 68px; padding: 11px 8px; font-size: 13px; }
            .tbtn.small { min-width: 48px; padding: 7px 4px; font-size: 11px; }
            #t-ignite { padding: 13px 8px; font-size: 15px; }
        }
        /* ==================== 更新提示弹窗 ==================== */
        .up-mask {
            position: fixed; inset: 0; z-index: 300;
            display: none;
            align-items: center; justify-content: center;
            background: rgba(5, 7, 13, .82);
        }
        .up-mask.show { display: flex; }

        .up-box {
            width: min(420px, calc(100vw - 40px));
            background: var(--surf-3);
            border: 1px solid var(--line);
            padding: 24px 24px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .6);
        }

        .up-hd {
            display: flex; align-items: center; gap: 9px;
            font-family: var(--mono);
            font-size: 12px; letter-spacing: .14em;
            color: var(--dim);
            padding-bottom: 12px; margin-bottom: 16px;
            border-bottom: 1px solid var(--line-dim);
        }
        .up-tick { width: 2px; height: 11px; background: var(--amber); flex: none; }

        .up-row {
            display: flex; justify-content: space-between;
            padding: 7px 0;
            font-size: 13.5px;
        }
        .up-k { color: var(--dim); }
        .up-v { font-family: var(--mono); color: var(--text); }
        .up-new { color: var(--amber); }

        .up-notes {
            margin-top: 12px; padding: 11px 13px;
            background: rgba(255, 255, 255, .03);
            border-left: 2px solid var(--line-strong);
            font-size: 12.5px; color: var(--dim);
            line-height: 1.65;
            max-height: 110px; overflow-y: auto;
        }
        .up-notes:empty { display: none; }

        .up-actions {
            display: flex; gap: 9px; margin-top: 20px;
        }
        .up-btn {
            flex: 1;
            padding: 11px 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 3px;
            color: var(--text);
            font-size: 13px; letter-spacing: .12em;
            font-family: inherit; cursor: pointer;
            transition: border-color .14s, background .14s, color .14s;
        }
        .up-btn:hover { border-color: var(--line-strong); background: rgba(255, 255, 255, .06); }
        .up-btn:disabled { opacity: .45; cursor: default; }
        .up-btn-primary { border-color: rgba(255, 195, 92, .45); color: var(--amber); }
        .up-btn-primary:hover { background: var(--amber); color: #0a0e14; border-color: var(--amber); }

        .up-status {
            margin-top: 12px;
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--dim);
            min-height: 16px;
            text-align: center;
            letter-spacing: .04em;
        }
        .up-status.err { color: var(--red); }
        .up-status.ok { color: var(--green); }

    </style>
</head>
<body>
    <canvas id="game" width="1000" height="700"></canvas>

    <!-- 左上：飞行数据（分层玻璃面板）+ 部件栏。
         #hud 只承载观战端的「等待操控端连接...」消息（main.js 写 innerText），
         观战端等待消息写这里；:empty 时空行自动隐藏。 -->
    <div id="top-left">
        <div id="hud"></div>
        <div id="parts-bar"></div>
    </div>

    <!-- 左右竖条：填充由 JS 写内联样式，容器/刻度/边框在这里 -->
    <div id="throttle-bar"><div id="throttle-fill"></div></div>
    <div id="throttle-text">油门 100%</div>
    <div id="stage-stack"></div>
    <div id="fuel-bar"><div id="fuel-fill"></div></div>
    <div id="fuel-text">燃料 100%</div>

    <!-- 成就横幅（JS 设 opacity/transform）与成就列表 -->
    <div id="achievement">
        <div id="achievement-title">成 就 达 成</div>
        <div id="achievement-name"></div>
        <div id="achievement-desc"></div>
    </div>
    <div id="achievement-panel" class="msp-corners msp-corners--amber"></div>

    <!-- ESC 暂停菜单：遮罩点击 = 继续；列表按钮由 js/ui/pauseMenu.js 生成 -->
    <div id="pause-menu" hidden>
        <div id="pause-card" class="msp-corners msp-corners--amber">
            <div class="pm-title">菜 单</div>
            <div class="pm-list" id="pause-list"></div>
            <div class="pm-note">ESC 继续 · 点遮罩处也可继续</div>
        </div>
    </div>

    <!-- 观战角标（竖排，JS 控制显示） -->
    <div id="spectator-badge" class="msp-corners msp-corners--amber">观 战 中</div>

    <!-- 键位说明：默认收起，点右下角 ? 展开（纯 CSS checkbox 方案，无 JS） -->
    <input type="checkbox" id="controls-toggle">
    <label id="controls-fab" for="controls-toggle">?</label>
    <div id="controls" class="msp-corners">
        <ul>
            <li><kbd>E</kbd>点火/关机</li>
            <li><kbd>A D</kbd>旋转</li>
            <li><kbd>↑↓</kbd>油门(Shift 微调)</li>
            <li><kbd>[ ]</kbd>缩放</li>
            <li class="span2"><kbd>+</kbd>加油 / <kbd>-</kbd>卸油(要着陆)</li>
            <li><kbd>空格</kbd>分离</li>
            <li><kbd>S</kbd>存档</li>
            <li><kbd>L</kbd>读档</li>
            <li><kbd>C</kbd>成就</li>
            <li><kbd>M</kbd>音乐</li>
        </ul>
        <div class="ctl-note"><i class="dash"></i>蓝色虚线 = 预测轨道</div>
    </div>

    <!-- 右上：时间倍率胶囊 + 系统按钮 -->
    <div id="top-buttons">
        <div id="time-btn">
            <button id="time-down" title="减速（,）">−</button>
            <div id="time-value">1x</div>
            <button id="time-up" title="加速（.）">+</button>
        </div>
        <div class="sys-row">
            <button class="sys-btn" onclick="saveGame()">
                <svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M8 4v5h7V4"/><rect x="8" y="13" width="8" height="7"/></svg>存档</button>
            <button class="sys-btn" onclick="loadGame()">
                <svg viewBox="0 0 24 24"><path d="M12 14V4"/><path d="M8 8l4-4 4 4"/><path d="M4 16v4h16v-4"/></svg>读档</button>
            <button class="sys-btn" onclick="toggleAchievementPanel()">
                <svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4a3 3 0 0 0 3 4"/><path d="M17 5h3a3 3 0 0 1-3 4"/><path d="M12 14v4"/><path d="M8 21h8"/></svg>成就</button>
            <button class="sys-btn" onclick="toggleBgm()">
                <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="15" r="2.5"/></svg>音乐</button>
            <button class="sys-btn" onclick="showCoopInfo()">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>协同</button>
            <button class="sys-btn" onclick="toggleTouchPanel()">
                <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></svg>触控</button>
            <button class="sys-btn" onclick="togglePauseMenu()">
                <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>菜单</button>
        </div>
    </div>

    <!-- 触控按键：按下 = 按下对应的键，和键盘走同一套逻辑 -->
    <div id="touch-controls">
        <div class="pad pad-left">
            <button class="tbtn small" id="t-zoom-out">缩小</button>
            <button class="tbtn small" id="t-zoom-in">放大</button>
            <button class="tbtn small" id="t-fine">微调</button>
            <button class="tbtn small" id="t-vessel">切船</button>
            <button class="tbtn" id="t-left">◀ 左转</button>
            <button class="tbtn" id="t-right">右转 ▶</button>
            <button class="tbtn wide" id="t-sep">分离</button>
        </div>
        <div class="pad pad-right">
            <button class="tbtn small" id="t-dump">卸油</button>
            <button class="tbtn small" id="t-fuel">加油</button>
            <button class="tbtn small" id="t-chute">伞</button>
            <button class="tbtn" id="t-thr-down">油门 −</button>
            <button class="tbtn" id="t-thr-up">油门 ＋</button>
            <button class="tbtn wide" id="t-ignite">点火 / 关机</button>
        </div>
    </div>

    <!-- ==================== 更新提示弹窗 ==================== -->
    <div id="update-mask" class="up-mask">
        <div class="up-box msp-corners msp-corners--amber">
            <div class="up-hd">
                <span class="up-tick"></span>
                <span>检 测 到 新 版 本</span>
            </div>
            <div class="up-body">
                <div class="up-row">
                    <span class="up-k">当前版本</span>
                    <span class="up-v" id="up-from">-</span>
                </div>
                <div class="up-row">
                    <span class="up-k">最新版本</span>
                    <span class="up-v up-new" id="up-to">-</span>
                </div>
                <div class="up-notes" id="up-notes"></div>
            </div>
            <div class="up-actions">
                <button class="up-btn up-btn-primary" id="up-yes">更 新</button>
                <button class="up-btn" id="up-no">稍 后 再 说</button>
            </div>
            <div class="up-status" id="up-status"></div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>

</body>
</html>
