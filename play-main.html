<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSP2D - 猫咪航天局</title>
    <style>
        html, body { height: 100%; }
        /* 画布铺满整个窗口：宇宙必须填满屏幕，按钮和 HUD 浮在它上面，
           而不是让宇宙缩在中间一小块、四周露出黑边。 */
        body { margin: 0; background: #05070d; height: 100vh; overflow: hidden; position: relative; }
        /* 画布自适应：手机上自动缩放到装得下，触控不要触发滚动/双指缩放 */
        canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; display: block;
            border: none; touch-action: none;
        }
        #hud {
            position: absolute; top: 10px; left: 10px; z-index: 3; color: #0f0;
            font-family: monospace; font-size: 14px; pointer-events: none;
            text-shadow: 1px 1px 2px #000; white-space: pre;
        }
        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #fff; font-family: monospace; background: rgba(0,0,0,0.7);
            padding: 10px 20px; border-radius: 8px; border: 1px solid #444;
            font-size: 13px; pointer-events: none;
        }
        /* 右上角按钮改成一行 flex，窄屏会自动换行 */
        #top-buttons {
            position: absolute; top: 10px; right: 10px;
            display: flex; gap: 8px; flex-wrap: wrap;
            justify-content: flex-end; max-width: 72%;
        }
        .btn-save {
            padding: 8px 15px; background: #333; color: #fff;
            border: 1px solid #666; border-radius: 4px; cursor: pointer;
            font-family: monospace; font-size: 13px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-save:hover { background: #555; }
        /* 节流阀（油门）条 */
        #throttle-bar {
            position: absolute; left: 14px; bottom: 200px;
            width: 20px; height: 170px;
            background: rgba(255,255,255,0.10);
            border: 1px solid #555; border-radius: 4px; overflow: hidden;
        }
        #throttle-fill {
            position: absolute; left: 0; bottom: 0; width: 100%; height: 100%;
            background: linear-gradient(#ffcc55, #ff8800);
        }
        #throttle-text {
            position: absolute; left: 14px; bottom: 376px; width: 220px;
            color: #ffcc55; font-family: monospace; font-size: 13px;
            text-shadow: 1px 1px 2px #000;
        }
        /* 燃料条（最右边那根） */
        #fuel-bar {
            position: absolute; right: 14px; bottom: 200px;
            width: 20px; height: 170px;
            background: rgba(255,255,255,0.10);
            border: 1px solid #555; border-radius: 4px; overflow: hidden;
        }
        #fuel-fill {
            position: absolute; left: 0; bottom: 0; width: 100%; height: 100%;
            background: linear-gradient(#66ddff, #2288cc);
        }
        #fuel-text {
            position: absolute; right: 14px; bottom: 376px; width: 260px;
            color: #66ddff; font-family: monospace; font-size: 13px;
            text-align: right; white-space: pre-line;
            text-shadow: 1px 1px 2px #000;
        }
        /* 成就达成：上方中间弹出的横幅 */
        #achievement {
            position: absolute; top: 22px; left: 50%;
            transform: translateX(-50%) translateY(-24px);
            padding: 12px 30px; text-align: center; pointer-events: none;
            background: rgba(10, 20, 40, 0.92);
            border: 1px solid #4a90d9; border-radius: 10px;
            box-shadow: 0 0 26px rgba(74, 144, 217, 0.55);
            opacity: 0; transition: opacity .35s, transform .35s;
            font-family: monospace; white-space: nowrap; z-index: 10;
        }
        #achievement-title { color: #4a90d9; font-size: 12px; letter-spacing: 5px; }
        #achievement-name { color: #fff; font-size: 22px; letter-spacing: 2px; margin-top: 3px; }
        #achievement-desc { color: #9cc4e8; font-size: 13px; margin-top: 5px; }
        /* 成就列表（按 C 打开 / 关闭） */
        #achievement-panel {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 640px; max-height: 80%; overflow-y: auto;
            padding: 16px 22px;
            background: rgba(6, 12, 24, 0.95);
            border: 1px solid #35506e; border-radius: 10px;
            font-family: monospace; z-index: 11;
        }
        .ach-head { color: #4a90d9; font-size: 15px; letter-spacing: 2px; margin-bottom: 10px; text-align: center; }
        .ach-row { display: flex; font-size: 13px; padding: 3px 0; }
        .ach-mark { width: 22px; }
        .ach-name { width: 116px; }
        .ach-desc { flex: 1; }
        .ach-row.got { color: #7fe0a8; }
        .ach-row.locked { color: #46586c; }
        /* ==================== 触控按键（手机自动显示，桌面按 T 或点"触控"也能开） ==================== */
        #touch-controls { position: absolute; inset: 0; pointer-events: none; display: none; }
        #touch-controls .pad { position: absolute; display: flex; gap: 8px; flex-wrap: wrap; width: 184px; }
        #touch-controls .pad-left { left: 12px; bottom: 12px; }
        #touch-controls .pad-right { right: 12px; bottom: 12px; justify-content: flex-end; }
        .tbtn {
            pointer-events: auto; touch-action: none;
            min-width: 86px; padding: 16px 14px;
            font-family: monospace; font-size: 15px; color: #cfe6ff;
            background: rgba(20, 34, 56, 0.62);
            border: 1px solid #4a6f9a; border-radius: 12px;
            -webkit-tap-highlight-color: transparent;
            user-select: none; cursor: pointer;
        }
        .tbtn.small { min-width: 54px; padding: 9px 6px; font-size: 12px; }
        .tbtn.wide { flex: 1 1 100%; min-width: 0; }
        .tbtn.active { background: rgba(74, 144, 217, 0.85); color: #fff; }
        #t-ignite {
            padding: 18px 10px; font-size: 17px;
            border-radius: 14px; border-color: #d08a2a; color: #ffd48a;
            background: rgba(60, 36, 8, 0.72);
        }
        #t-ignite.active { background: rgba(255, 170, 0, 0.9); color: #241400; }
        /* 屏幕矮的时候（横屏手机）把东西都缩小一点 */
        @media (max-height: 620px) {
            #hud { font-size: 11px; }
            #throttle-bar, #fuel-bar { height: 88px; bottom: 150px; }
            #throttle-text, #fuel-text { font-size: 11px; bottom: 244px; }
            .tbtn { min-width: 68px; padding: 11px 8px; font-size: 13px; }
            .tbtn.small { min-width: 48px; padding: 7px 4px; font-size: 11px; }
            #t-ignite { padding: 13px 8px; font-size: 15px; }
        }
        /* 观战模式角标 */
        #spectator-badge {
            display: none; position: absolute; top: 50%; left: 22px;
            transform: translateY(-50%);
            color: #ffc35c; font-family: monospace; font-size: 15px;
            letter-spacing: 4px; writing-mode: vertical-rl;
            text-shadow: 0 0 12px rgba(255,195,92,.7); pointer-events: none;
        }
        /* 竖屏手机：按键再缩一圈，左右两排才不会打架 */
        @media (max-width: 460px) {
            #touch-controls .pad { width: 150px; gap: 6px; }
            .tbtn { min-width: 70px; padding: 11px 8px; font-size: 12px; }
            .tbtn.small { min-width: 44px; padding: 7px 3px; font-size: 11px; }
            #top-buttons { max-width: 62%; gap: 6px; }
            .btn-save { padding: 6px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <canvas id="game" width="1000" height="700"></canvas>
    <div id="hud"></div>
    <div id="throttle-bar"><div id="throttle-fill"></div></div>
    <div id="throttle-text">油门 100%</div>
    <div id="fuel-bar"><div id="fuel-fill"></div></div>
    <div id="fuel-text">燃料 100%</div>
    <div id="achievement">
        <div id="achievement-title">成 就 达 成</div>
        <div id="achievement-name"></div>
        <div id="achievement-desc"></div>
    </div>
    <div id="achievement-panel"></div>
    <div id="spectator-badge">观 战 中</div>
    <div id="controls">E 点火/关机　A D 旋转　↑↓ 油门(Shift 微调)　[ ] 缩放　+ 加油 / - 卸油(要着陆)　S 存档　L 读档　C 成就　M 音乐　|　蓝色虚线 = 预测轨道</div>
    <div id="top-buttons">
        <button class="btn-save" onclick="saveGame()">存档</button>
        <button class="btn-save" onclick="loadGame()">读档</button>
        <button class="btn-save" onclick="toggleAchievementPanel()">成就</button>
        <button class="btn-save" onclick="toggleBgm()">音乐</button>
        <button class="btn-save" onclick="showCoopInfo()">协同</button>
        <button class="btn-save" onclick="toggleTouchPanel()">触控</button>
    </div>

    <!-- 触控按键：按下 = 按下对应的键，和键盘走同一套逻辑 -->
    <div id="touch-controls">
        <div class="pad pad-left">
            <button class="tbtn small" id="t-zoom-out">缩小</button>
            <button class="tbtn small" id="t-zoom-in">放大</button>
            <button class="tbtn small" id="t-fine">微调</button>
            <button class="tbtn" id="t-left">◀ 左转</button>
            <button class="tbtn" id="t-right">右转 ▶</button>
        </div>
        <div class="pad pad-right">
            <button class="tbtn small" id="t-dump">卸油</button>
            <button class="tbtn small" id="t-fuel">加油</button>
            <button class="tbtn" id="t-thr-down">油门 −</button>
            <button class="tbtn" id="t-thr-up">油门 ＋</button>
            <button class="tbtn wide" id="t-ignite">点火 / 关机</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // ==================== 画布自适应 ====================
        // 画布铺满窗口，宇宙才有足够的显示面积。
        // 渲染分辨率跟着窗口走（考虑高 DPI），物理坐标不变。
        // 逻辑画布尺寸（绘制时统一用这两个，替代以前写死的 1000 / 700）
        let canvasW = 1000, canvasH = 700;
        function fitCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = Math.max(320, window.innerWidth);
            const h = Math.max(240, window.innerHeight);
            canvas.width = Math.round(w * dpr);      // canvas.width 是物理像素
            canvas.height = Math.round(h * dpr);
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);  // 之后所有绘制都用逻辑坐标
            canvasW = w; canvasH = h;
        }
        fitCanvas();
        window.addEventListener('resize', () => { fitCanvas(); });
        window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 120));
        const hud = document.getElementById('hud');
        const throttleFill = document.getElementById('throttle-fill');
        const throttleText = document.getElementById('throttle-text');
        const fuelFill = document.getElementById('fuel-fill');
        const fuelText = document.getElementById('fuel-text');
        const achievementEl = document.getElementById('achievement');
        const achievementTitleEl = document.getElementById('achievement-title');
        const achievementNameEl = document.getElementById('achievement-name');
        const achievementDescEl = document.getElementById('achievement-desc');
        const achievementPanelEl = document.getElementById('achievement-panel');
        const touchControlsEl = document.getElementById('touch-controls');

        // ==================== 多端协同 ====================
        // 服务器上的服主决定每个端是「操控」还是「观战」。
        // 操控端算物理并上报；观战端不跑物理，只把服务器状态插值渲染出来。
        let clientId = "";
        try {
            clientId = localStorage.getItem("msp2d-client-id") || "";
            if (!clientId) {
                clientId = "c" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
                localStorage.setItem("msp2d-client-id", clientId);
            }
        } catch (e) { clientId = "c" + Math.random().toString(36).slice(2, 10); }

        let myRole = "control";        // 默认单人自己玩，就是操控端
        let isAdmin = false;
        let onlineCount = 1;
        let controllerId = null;
        let netMode = false;           // 有没有连上协同服务器
        let lastSentAt = 0;
        let lastCtrlPollAt = 0;
        let lastStatePollAt = 0;
        let lastRecvAt = 0;

        // 观战端用：服务器状态 + 插值
        let remotePrev = null;
        let remoteNext = null;
        let remoteRecvTime = 0;
        const SEND_INTERVAL_MS = 100;   // 操控端每 100ms 上报一次
        const POLL_INTERVAL_MS = 100;   // 观战端每 100ms 拉一次
        const CTRL_INTERVAL_MS = 1000;  // 每 1 秒问一次自己是什么角色
        const REMOTE_TIMEOUT_MS = 3000;

        function isSpectator() { return netMode && myRole !== "control"; }

        function apiUrl(path) {
            return path + (path.indexOf("?") >= 0 ? "&" : "?") + "cid=" + encodeURIComponent(clientId);
        }

        async function pollControl() {
            try {
                const r = await fetch(apiUrl("/api/ctrl"));
                const d = await r.json();
                netMode = true;
                const changed = (d.role !== myRole);
                myRole = d.role;
                isAdmin = !!d.is_admin;
                onlineCount = d.online_count || 1;
                controllerId = d.controller || null;
                if (changed) {
                    const spectating = myRole !== "control";
                    toastQueue.push({
                        name: spectating ? "观战模式" : "操控模式",
                        desc: spectating ? "服主把你设为观战端，跟操控端一起看" : "服主把操控权交给你了，开始操作吧",
                        title: "协 同 通 知"
                    });
                }
            } catch (e) {
                netMode = false;   // 服务器不在（比如直接双击打开 html），就单机自己玩
            }
        }

        async function sendState() {
            if (isSpectator()) return;
            const now = performance.now();
            if (now - lastSentAt < SEND_INTERVAL_MS) return;
            lastSentAt = now;
            const payload = {
                rocket: { x: rocket.x, y: rocket.y, vx: rocket.vx, vy: rocket.vy, angle: rocket.angle,
                          throttle: rocket.throttle, fuel: rocket.fuel, state: rocket.state, landed: rocket.landed },
                camera: { x: camera.x, y: camera.y, zoom: camera.zoom },
                orbits: stats.orbits,
                // 给「喵星地面观察站」看的信息
                shipName: shipDef.name || '当前航天器',
                hasCapsule: hasWorkingCapsule(),
                parts: shipDef.parts.map(p => ({ type: p.type, alive: !destroyed.has(p.id) })),
                derelicts: vessels.filter(v => v.id !== activeVesselId).map(v => ({
                    x: v.x, y: v.y, vx: v.vx, vy: v.vy, angle: v.angle,
                    fuel: v.fuel, landed: v.landed,
                    parts: v.def.parts.map(p => ({ type: p.type, alive: !v.destroyed.has(p.id) })),
                })),
                planet: { x: planet.x, y: planet.y, radius: planet.radius },
            };
            try {
                await fetch(apiUrl("/api/state"), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch (e) { /* 掉线了也不影响本地继续玩 */ }
        }

        async function fetchState() {
            if (!isSpectator()) return;
            const now = performance.now();
            if (now - lastStatePollAt < POLL_INTERVAL_MS) return;
            lastStatePollAt = now;
            try {
                const r = await fetch(apiUrl("/api/state?since=0"));
                const d = await r.json();
                if (d && d.changed && d.world) {
                    remotePrev = remoteNext || d.world;
                    remoteNext = d.world;
                    remoteRecvTime = performance.now();
                    lastRecvAt = remoteRecvTime;
                }
            } catch (e) {}
        }

        // 观战端：把服务器来的状态插值到当前帧，画面才顺滑
        function applyRemoteWorld() {
            const now = performance.now();
            const stale = (now - lastRecvAt) > REMOTE_TIMEOUT_MS;

            if (!remoteNext) {
                if (stale) hud.innerText = "等待操控端连接...";
                return;
            }
            const t = Math.min(1, (now - remoteRecvTime) / POLL_INTERVAL_MS);
            const a = remotePrev && remotePrev.rocket ? remotePrev.rocket : remoteNext.rocket;
            const b = remoteNext.rocket;
            const lerp = (p, q) => p + (q - p) * t;

            // 角度走最短弧，避免从 359° 转到 1° 时整圈乱转
            let da = b.angle - a.angle;
            while (da > 180) da -= 360;
            while (da < -180) da += 360;

            rocket.x = lerp(a.x, b.x);
            rocket.y = lerp(a.y, b.y);
            rocket.vx = b.vx; rocket.vy = b.vy;
            rocket.angle = ((a.angle + da * t) % 360 + 360) % 360;
            rocket.throttle = b.throttle;
            rocket.fuel = b.fuel;
            rocket.state = b.state;
            rocket.landed = b.landed;

            if (remoteNext.camera) {
                camera.x = lerp(camera.x, remoteNext.camera.x);
                camera.y = lerp(camera.y, remoteNext.camera.y);
                camera.zoom = lerp(camera.zoom, remoteNext.camera.zoom);
            }
            if (typeof remoteNext.orbits === "number" && remoteNext.orbits > stats.orbits) {
                stats.orbits = remoteNext.orbits;
            }
        }

        // ==================== 背景音乐：miaosic / Higher ====================
        const bgm = new Audio('miaosic/BGM-Higher.mp3');
        bgm.loop = true;
        bgm.volume = 0.45;

        let bgmMuted = false;
        try { bgmMuted = localStorage.getItem('msp2d-bgm-muted') === '1'; } catch (e) {}
        if (bgmMuted) bgm.volume = 0;

        function startBgm() {
            if (bgmMuted) return;
            try {
                const p = bgm.play();
                if (p && p.catch) p.catch(() => {});   // 浏览器不让自动播放就先算了
            } catch (e) {}
        }

        function toggleBgm() {
            bgmMuted = !bgmMuted;
            try { localStorage.setItem('msp2d-bgm-muted', bgmMuted ? '1' : '0'); } catch (e) {}
            if (bgmMuted) {
                bgm.pause();
            } else {
                bgm.volume = 0.45;
                startBgm();
            }
        }

        // 浏览器规定：必须先有用户操作（点击 / 按键）才允许放声音
        canvas.addEventListener('pointerdown', startBgm);
        window.addEventListener('pointerdown', startBgm);
        window.addEventListener('keydown', startBgm);

        // ==== 游戏数据 ====
        // 星球：radius = 半径（像素），越大星球越大。
        // 引力用“平方反比”，和真实星球、和 SFS 一样：
        //     引力 = surfaceGravity × (radius / 距离)²
        // 所以贴着地面时的引力就是 surfaceGravity —— 想让星球变重只改这个数。
        const planet = {
            x: 500, y: 350,
            radius: 4000,          // 半径（像素）—— 星球更大，地平线更平，像一颗真正的行星
            surfaceGravity: 420    // 贴着地面时的引力（px/s²）—— 数字越大星球越"重"，越难起飞
        };
        const rocket = {
            x: planet.x, y: planet.y - (planet.radius + 8), vx: 0, vy: 0,   // 一开始就停在星球表面（跟着半径自动算，改星球大小不用再改这里）
            angle: 90,
            throttle: 1,                      // 节流阀：0 ~ 1
            fuel: 1,                          // 燃料：0 ~ 1（1 = 满格）
            state: 'idle',                    // idle = 关机，firing = 点火
            landed: true                      // 是否正停在星球上
        };

        // ==== 视角控制 ====
        // minZoom 调小 = 能拉得更远（0.02 时视野是屏幕的 50 倍宽，能看见整个星球和周边轨道）
        let camera = { x: 0, y: 0, zoom: 0.5, minZoom: 0.012, maxZoom: 6.0 };

        // 物理参数
        const FIXED_DT = 1 / 60;
        let accumulator = 0;
        let lastTime = performance.now();

        // 旋转速度（度/秒），改成你要的手感就调这个数
        const ROTATE_SPEED = 180;

        // 节流阀调节速度（每秒变化多少），按住 Shift 改成微调速度
        const THROTTLE_RATE = 0.30;
        const THROTTLE_FINE_RATE = 0.06;

        // 缩放：按住 [ / ] 时的缩放速度（每秒乘多少）
        const ZOOM_RATE_PER_SEC = 0.25;

        // 燃料：满格能烧多少秒（100% 油门），以及在地面加油/卸油的速度（每秒多少格）
        const FUEL_BURN_SECONDS = 120;  // 满油门烧完一箱要多少秒（数字越大油越多、越耐用）
        const FUEL_FILL_RATE = 0.6;     // 每秒补 60%，大约 1.7 秒加满

        // ==================== 部件（和 build.html 的定义必须一致）====================
        const PART_TYPES = {
            capsule: { name: '控制舱', w: 2, h: 2, mass: 30, fuel: 0, thrust: 0,
                       body: '#d8e4f2', edge: '#8fa8c4', accent: '#4a90d9' },
            tank:    { name: '燃料箱', w: 2, h: 3, mass: 20, fuel: 40, thrust: 0,
                       body: '#e8eef6', edge: '#9db2c9', accent: '#ff8800' },
            engine:  { name: '发动机', w: 2, h: 2, mass: 25, fuel: 0, thrust: 80000,
                       body: '#8d99a8', edge: '#5c6874', accent: '#ff5544' },
        };
        const PART_PX = 7;           // 游戏里一格画多少像素（调小 = 飞船看着更小；建造页是 20）

        // ==================== 真实单位 ====================
        // 飞船最小部件宽 2 格 = 0.7 米，所以 1 格 = 0.35 米 → 1 像素 = 0.05 米。
        // 全场景共用这一个比例（星球和飞船同一套），所以数字彼此自洽，
        // 不会出现「飞船 2.45 米、星球 3000 公里」那种差 100 万倍的矛盾。
        const METERS_PER_GRID = 0.35;
        const METERS_PER_PX = METERS_PER_GRID / PART_PX;

        // 像素 → 距离文字
        function fmtDistance(px) {
            const m = px * METERS_PER_PX;
            if (Math.abs(m) >= 1000) return (m / 1000).toFixed(2) + ' km';
            if (Math.abs(m) >= 1) return m.toFixed(m >= 100 ? 0 : 1) + ' m';
            return (m * 100).toFixed(0) + ' cm';
        }
        // 像素/秒 → 速度文字
        function fmtSpeed(pxPerSec) {
            const ms = pxPerSec * METERS_PER_PX;
            if (Math.abs(ms) >= 1000) return (ms / 1000).toFixed(2) + ' km/s';
            return ms.toFixed(ms >= 100 ? 0 : 1) + ' m/s';
        }
        // 飞船尺寸（米）
        function shipSizeMeters() {
            return { w: SPEC.width / PART_PX * METERS_PER_GRID,
                     h: SPEC.height / PART_PX * METERS_PER_GRID };
        }

        function defaultShip() {
            return { version: 1, name: '默认船', parts: [
                { id: 'd1', type: 'engine',  x: 0, y: 0 },
                { id: 'd2', type: 'tank',    x: 0, y: 2 },
                { id: 'd3', type: 'capsule', x: 0, y: 5 },
            ]};
        }

        function loadShipLocal() {
            try {
                const raw = localStorage.getItem('msp2d-ship');
                if (!raw) return defaultShip();
                const s = JSON.parse(raw);
                if (!s || !Array.isArray(s.parts) || s.parts.length === 0) return defaultShip();
                s.parts = s.parts.filter(p => p && PART_TYPES[p.type]);
                return s.parts.length ? s : defaultShip();
            } catch (e) { return defaultShip(); }
        }

        let shipDef = loadShipLocal();

        // 从部件算出：空船质量、燃料容量、总推力、包围盒
        // 活着的部件算出来的燃料容量（炸掉的箱子不再提供容量）
        function aliveFuelCap() {
            let cap = 0;
            for (const p of shipDef.parts) {
                if (destroyed.has(p.id)) continue;
                const t = PART_TYPES[p.type];
                if (t) cap += t.fuel;
            }
            return cap;
        }
        // 注意：SPEC.fuelCap 是「按当时还活着的部件」算的，
        // 所以炸掉箱子后 SPEC 重算一次才是准的 —— splitVessel 里会做。

        function shipSpec(def) {
            let dryMass = 0, fuelCap = 0, thrust = 0;
            let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
            for (const p of def.parts) {
                const t = PART_TYPES[p.type];
                if (!t) continue;
                dryMass += t.mass; fuelCap += t.fuel; thrust += t.thrust;
                minX = Math.min(minX, p.x);             maxX = Math.max(maxX, p.x + t.w);
                minY = Math.min(minY, p.y);             maxY = Math.max(maxY, p.y + t.h);
            }
            if (minX > maxX) { minX = 0; maxX = 2; minY = 0; maxY = 2; }
            const cx = (minX + maxX) / 2;
            const spec = {
                dryMass, fuelCap, thrust,
                box: { minX, maxX, minY, maxY },
                width: (maxX - minX) * PART_PX,
                height: (maxY - minY) * PART_PX,
                centerX: cx,                     // 船的中轴（格坐标）
                bottomY: minY,                   // 最底下（发动机喷口）
                corners: null,                   // 下面填
                com: { x: 0, y: 0 },             // 质心（本地像素坐标）
            };
            spec.corners = shipCollisionPoints(def, spec);
            spec.com = shipCenterOfMass(def, spec);
            return spec;
        }

        // ==================== 质心（重心）====================
        // 航天器应该绕自己的重心旋转，而不是绕控制舱、也不是绕船底。
        // 做法：每个部件的质量放在它自己的几何中心上，加权平均。
        //   燃料算在燃料箱里 —— 所以油烧掉后，重心会往船头方向偏。
        function shipCenterOfMass(def, spec, fuelRatio) {
            const P = PART_PX;
            const fr = (typeof fuelRatio === 'number') ? fuelRatio : 1;   // 默认按满油算
            const cx = spec.centerX;
            const bottom = spec.box.maxY;
            let mx = 0, my = 0, total = 0;

            for (const p of def.parts) {
                const t = PART_TYPES[p.type];
                if (!t) continue;
                // 部件质量：燃料箱里有多少油，就算多少燃料质量（质量随燃料减少）
                const partFuel = t.fuel * fr;
                const m = t.mass + partFuel;
                if (m <= 0) continue;
                // 部件几何中心（本地像素：x 以中轴为 0，y 以底面为 0、向上为负）
                const px = (p.x + t.w / 2 - cx) * P;
                const py = (bottom - (p.y + t.h / 2)) * P;
                mx += px * m;
                my += py * m;
                total += m;
            }
            if (total <= 0) return { x: 0, y: 0 };
            return { x: mx / total, y: my / total };
        }

        // ==================== 碰撞箱 ====================
        // 飞船不是"一个点" —— 有大小、还会转。
        // 所以取一圈轮廓点（船体的四个角 + 每个部件的外角），
        // 撞地判定看「哪个点最低」，着陆就贴在那个点上，这样船才不会插进地里。
        function shipCollisionPoints(def, spec) {
            const P = PART_PX;
            const cx = spec.centerX;
            const bottom = spec.box.maxY;
            const pts = [];
            const seen = {};

            function add(gx, gy) {
                const key = gx.toFixed(2) + ',' + gy.toFixed(2);
                if (seen[key]) return;
                seen[key] = 1;
                // 网格坐标（y 向上）→ 船体本地像素（x 以中轴为 0，y 以底面为 0、向上为负）
                pts.push({ x: (gx - cx) * P, y: (bottom - gy) * P });
            }

            // 整体包围盒的四个角
            add(spec.box.minX, spec.box.minY);
            add(spec.box.maxX, spec.box.minY);
            add(spec.box.minX, spec.box.maxY);
            add(spec.box.maxX, spec.box.maxY);

            // 每个部件的四个角（这样凹凸的外形也能被算进去）
            for (const p of def.parts) {
                const t = PART_TYPES[p.type];
                if (!t) continue;
                add(p.x, p.y);
                add(p.x + t.w, p.y);
                add(p.x, p.y + t.h);
                add(p.x + t.w, p.y + t.h);
            }
            return pts;
        }

        // 把船的本地坐标点转到世界坐标（考虑位置和旋转）
        // 本地坐标（以船底中轴为原点）→ 世界坐标
        // 旋转中心是「质心」：先把点相对于质心摆好，再转，再平移回去。
        function shipPointWorld(lx, ly, angleDeg) {
            const a = (angleDeg - 90) * Math.PI / 180;   // 和绘制用的是同一个旋转
            const cos = Math.cos(a), sin = Math.sin(a);
            const rx = lx - SPEC.com.x;                  // 相对质心
            const ry = ly - SPEC.com.y;
            return { x: rocket.x + rx * cos - ry * sin,
                     y: rocket.y + rx * sin + ry * cos };
        }

        // 找出离星球中心最近的那个碰撞点（也就是"最低"的那个）
        function lowestCollisionPoint(angleDeg) {
            let best = null, bestD = Infinity;
            for (const p of SPEC.corners) {
                const w = shipPointWorld(p.x, p.y, angleDeg);
                const dx = w.x - planet.x, dy = w.y - planet.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < bestD) { bestD = d; best = { local: p, world: w, dist: d }; }
            }
            return best;
        }

        // 把飞船放到「碰撞箱最深点正好贴在地表」的位置。
        // 不能简单写 planet.radius —— rocket.y 是船体本地原点，
        // 最深的碰撞点可能在原点下方（取决于你拼的船形）。
        function placeOnSurface() {
            rocket.x = planet.x;
            rocket.y = planet.y - planet.radius;
            for (let i = 0; i < 8; i++) {
                const hit = lowestCollisionPoint(rocket.angle);
                if (!hit || hit.dist <= 0) break;
                const push = hit.dist - planet.radius;
                if (Math.abs(push) < 0.01) break;
                const ux = (hit.world.x - planet.x) / hit.dist;
                const uy = (hit.world.y - planet.y) / hit.dist;
                rocket.x -= ux * push;
                rocket.y -= uy * push;
            }
            rocket.vx = 0;
            rocket.vy = 0;
            rocket.landed = true;
        }

        // ==================== 质量模型（燃料会变轻）====================
        // 总质量 = 空船质量 + 燃料质量
        // 加速度 = 推力 / 总质量
        // 所以：油越少 → 飞船越轻 → 同样的油门加速越快。
        // 这也是真实火箭的脾气（齐奥尔科夫斯基公式讲的就是这件事）。
        // 质量 / 推力 全部由「你造的飞船」决定：
        //   空船质量 = Σ 部件质量
        //   燃料质量 = Σ 燃料箱容量
        //   总推力   = Σ 发动机推力
        // 燃料烧掉多少，质量就减轻多少 —— 这就是「燃料减少，重量也减少」。
        let SPEC = shipSpec(shipDef);   // 分离后要重算，所以是 let
        const DRY_MASS = SPEC.dryMass;
        const FUEL_MASS = SPEC.fuelCap;
        const FULL_THRUST = SPEC.thrust;

        function shipMass(fuel) {
            return DRY_MASS + FUEL_MASS * Math.max(0, Math.min(1, fuel));
        }

        // 当前实际加速度（已经算上油门和质量）
        function thrustAccel(fuel, throttle) {
            const m = shipMass(fuel);
            return m > 0 ? FULL_THRUST * throttle / m : 0;
        }

        let fuelMsgTimer = 0;           // 在空中按 +/- 时的提示，显示 2 秒

        // ==================== 成就系统 ====================
        const achievements = [
            { id: 'first_flight',  name: '首飞',       desc: '第一次点火离开星球表面' },
            { id: 'soft_landing',  name: '稳如老猫',   desc: '着陆时垂直速度低于 20 px/s' },
            { id: 'hard_landing',  name: '硬着陆',     desc: '以超过 250 px/s 的速度砸在星球上还活着' },
            { id: 'true_hard_landing', name: '真·硬着陆', desc: '着陆时把至少一个部件撞炸了' },
            { id: 'survive_wreck',     name: '残骸归来',   desc: '撞掉一半以上部件，还成功着陆' },
            { id: 'no_scratch',        name: '毫发无伤',   desc: '一次着陆，垂直速度低于 5 px/s' },
            { id: 'burned_up',         name: '火烧眉毛',   desc: '再入时部件被高温烧毁' },
            { id: 'capsule_survives',  name: '返回舱幸存', desc: '其它部件全烧光，控制舱还挺着' },
            { id: 'meteor',            name: '流星',       desc: '以超过 400 px/s 冲进大气层' },
            { id: 'split_vessel',      name: '断成两截',   desc: '飞船在太空中分离成多个航天器' },
            { id: 'derelict_keeper',   name: '太空垃圾场', desc: '同时存在 3 个以上航天器' },
            { id: 'refuel_full',   name: '补给完毕',   desc: '在地面上把燃料加满' },
            { id: 'dump_half',     name: '减负',       desc: '在地面上卸掉一半以上的燃料' },
            { id: 'save_game',     name: '存档习惯',   desc: '用 S 存一次档' },
            { id: 'zoom_min',      name: '极目远眺',   desc: '把视野缩到最小' },
            { id: 'fine_tune',     name: '精细操作',   desc: '用 Shift 微调过油门' },
            { id: 'speed_300',     name: '三百俱乐部', desc: '速度达到 300 px/s' },
            { id: 'speed_600',     name: '六百俱乐部', desc: '速度达到 600 px/s' },
            { id: 'alt_1000',      name: '一千高空',   desc: '离地高度超过 1000 px' },
            { id: 'alt_5000',      name: '越飞越高',   desc: '离地高度超过 5000 px' },
            { id: 'orbit',         name: '入轨',       desc: '绕星球完整转满一圈不掉下来' },
            { id: 'orbit3',        name: '三圈',       desc: '累计绕满三圈' },
            { id: 'orbit5',        name: '环球旅行',   desc: '累计绕满五圈' },
            { id: 'escape',        name: '脱离摇篮',   desc: '达到逃逸速度' },
            { id: 'homing_cat',    name: '迷路的猫',   desc: '飞出引力范围后又自己飞回来着陆' },
            { id: 'out_of_fuel',   name: '弹尽粮绝',   desc: '在空中把燃料烧到 0', instant: true },
            { id: 'low_fuel_land', name: '油表见底',   desc: '燃料不到 5% 还能平安着陆' },
            { id: 'hover_king',    name: '悬停大师',   desc: '把离地高度稳定在 200 px 附近连续 3 秒' },
            { id: 'round_trip',    name: '环游半球',   desc: '着陆点离起飞点超过 3000 px' },
        ];

        const GRAVITY_MU = planet.surfaceGravity * planet.radius * planet.radius;
        const achieved = new Set();
        const pendingSettlement = [];   // 这一趟任务拿到、还没结算的成就
        const toastQueue = [];
        let toastCurrent = null;
        let toastTimer = 0;
        let achievementPanelOpen = false;

        const stats = {
            orbits: 0, sweep: 0, lastAngle: 0,
            maxSpeed: 0, maxAlt: 0, hoverTime: 0,
            escaped: false, dumpedFuel: 0,
            launchX: 0, launchY: 0
        };

        // 成就记录存在浏览器里，下次打开还在
        try {
            const savedList = JSON.parse(localStorage.getItem('msp2d-achievements') || '[]');
            if (Array.isArray(savedList)) savedList.forEach((id) => achieved.add(id));
        } catch (err) { /* 浏览器不给用 localStorage 就当没存过 */ }

        function saveAchievements() {
            try { localStorage.setItem('msp2d-achievements', JSON.stringify([...achieved])); } catch (err) {}
        }

        function unlock(id) {
            if (achieved.has(id) || pendingSettlement.some((a) => a.id === id)) return;
            const a = achievements.find((x) => x.id === id);
            if (!a) return;
            // 弹尽粮绝当场就弹（不然万一回不来，永远等不到结算）
            if (a.instant) {
                achieved.add(id);
                saveAchievements();
                toastQueue.push(a);
                return;
            }
            pendingSettlement.push(a);   // 其它都攒着，等着陆结算
        }

        // 着陆结算：这一趟任务里拿到的成就一次性揭晓
        function settleMission() {
            if (pendingSettlement.length === 0) return;
            pendingSettlement.forEach((a) => {
                if (achieved.has(a.id)) return;
                achieved.add(a.id);
                toastQueue.push({ name: a.name, desc: a.desc, title: '任 务 结 算' });
            });
            pendingSettlement.length = 0;
            saveAchievements();
        }

        // 一次达成好几个的时候排队一个一个弹
        function updateAchievementToast(dt) {
            if (toastTimer > 0) {
                toastTimer -= dt;
                if (toastTimer <= 0) {
                    achievementEl.style.opacity = '0';
                    achievementEl.style.transform = 'translateX(-50%) translateY(-24px)';
                    toastCurrent = null;
                }
                return;
            }
            if (toastCurrent === null && toastQueue.length > 0) {
                toastCurrent = toastQueue.shift();
                achievementTitleEl.innerText = toastCurrent.title || '成 就 达 成';
                achievementNameEl.innerText = toastCurrent.name;
                achievementDescEl.innerText = toastCurrent.desc;
                achievementEl.style.opacity = '1';
                achievementEl.style.transform = 'translateX(-50%) translateY(0)';
                toastTimer = 3;
            }
        }

        function toggleAchievementPanel() {
            achievementPanelOpen = !achievementPanelOpen;
            if (achievementPanelOpen) {
                const rows = achievements.map((a) => {
                    const got = achieved.has(a.id);
                    return '<div class="ach-row ' + (got ? 'got' : 'locked') + '">'
                        + '<span class="ach-mark">' + (got ? '●' : '○') + '</span>'
                        + '<span class="ach-name">' + a.name + '</span>'
                        + '<span class="ach-desc">' + a.desc + '</span></div>';
                }).join('');
                achievementPanelEl.innerHTML =
                    '<div class="ach-head">成就　' + achieved.size + ' / ' + achievements.length + '　（按 C 关闭）</div>' + rows;
            }
            achievementPanelEl.style.display = achievementPanelOpen ? 'block' : 'none';
        }

        // 每个物理步都会检查一遍
        function checkAchievements(dt) {
            const rx = rocket.x - planet.x;
            const ry = rocket.y - planet.y;
            const r = Math.sqrt(rx * rx + ry * ry) || 1;
            const alt = r - planet.radius;
            const speed = Math.sqrt(rocket.vx * rocket.vx + rocket.vy * rocket.vy);
            const ang = Math.atan2(ry, rx);

            if (speed > stats.maxSpeed) stats.maxSpeed = speed;
            if (alt > stats.maxAlt) stats.maxAlt = alt;
            if (stats.maxSpeed >= 300) unlock('speed_300');
            if (stats.maxSpeed >= 600) unlock('speed_600');
            if (stats.maxAlt >= 1000) unlock('alt_1000');
            if (stats.maxAlt >= 5000) unlock('alt_5000');

            // 逃逸：能量 ≥ 0，而且必须真的是往外飞。
            // （不然一头扎向地面的俯冲也算能量 ≥ 0，那就成"撞地逃逸"了）
            const radialSpeed = (rocket.vx * rx + rocket.vy * ry) / r;
            if (speed * speed / 2 - GRAVITY_MU / r >= 0 && radialSpeed > 0) {
                stats.escaped = true;
                unlock('escape');
            }

            if (!rocket.landed) {
                let da = ang - stats.lastAngle;
                while (da > Math.PI) da -= 2 * Math.PI;
                while (da < -Math.PI) da += 2 * Math.PI;
                stats.sweep += Math.abs(da);
                if (stats.sweep >= Math.PI * 2) {
                    stats.sweep -= Math.PI * 2;
                    stats.orbits += 1;
                    unlock('orbit');
                    if (stats.orbits >= 3) unlock('orbit3');
                    if (stats.orbits >= 5) unlock('orbit5');
                }
                // 悬停：离地 200px 上下 20px 保持 3 秒
                if (Math.abs(alt - 200) < 20) {
                    stats.hoverTime += dt;
                    if (stats.hoverTime >= 3) unlock('hover_king');
                } else {
                    stats.hoverTime = 0;
                }
            } else {
                stats.sweep = 0;
                stats.hoverTime = 0;
            }
            stats.lastAngle = ang;
        }

        // 着陆参数
        const LANDING_SPEED = 180;    // 扎向地面的速度小于它就稳稳着陆，大于它就弹一下

        // ==================== 撞击损毁 ====================
        // 撞得太狠，部件会被震坏、炸掉，同时吃掉一部分速度。
        // 每个部件的耐久不同：燃料箱厚实，控制舱脆一些。
        const DAMAGE_SPEED = 120;     // 超过这个撞击速度才开始受损
        const DESTROY_SPEED = 420;    // 超过这个速度，撞在哪儿哪儿直接炸
        const PART_HP = { capsule: 70, tank: 110, engine: 90 };

        // ==================== 再入热损毁 ====================
        // 高速冲进大气时，**迎着气流的那一面**会升温。
        // 哪个部件在前面晒着，哪个就先烧起来；温度到阈值就炸。
        // 控制舱（返回舱）有隔热盾，阈值高得多 —— 它就是干这个的。
        const HEAT_LIMIT = {
            capsule: 900,    // 控制舱：带隔热盾，最耐烧
            tank:    260,    // 燃料箱：薄壳，最先烧穿
            engine:  420,    // 发动机：金属，中等
        };
        const HEAT_COOL_RATE = 220;      // 每秒散热多少度（不在大气里时）
        const AMBIENT_TEMP = 20;         // 环境温度

        // 每个部件的当前温度
        let partTemp = {};
        let heatWrecked = 0;             // 这一趟烧毁了几个

        function initPartTemp() {
            const t = {};
            for (const p of shipDef.parts) t[p.id] = AMBIENT_TEMP;
            return t;
        }
        partTemp = initPartTemp();

        // 冲击加热：算每个部件"迎着气流"的程度（0~1）
        // 迎风面 = 部件中心相对飞船质心、在速度反方向上的投影
        function partWindExposure(p) {
            const t = PART_TYPES[p.type];
            if (!t) return 0;
            const P = PART_PX;
            // 部件中心（本地像素，已相对质心）
            const cx = (p.x + t.w / 2 - SPEC.centerX) * P - SPEC.com.x;
            const cy = (SPEC.box.maxY - (p.y + t.h / 2)) * P - SPEC.com.y;
            // 转到世界方向
            const a = (rocket.angle - 90) * Math.PI / 180;
            const wx = cx * Math.cos(a) - cy * Math.sin(a);
            const wy = cx * Math.sin(a) + cy * Math.cos(a);
            // 速度方向（气流从哪来）
            const sp = Math.hypot(rocket.vx, rocket.vy);
            if (sp < 1) return 0;
            const ux = rocket.vx / sp, uy = rocket.vy / sp;
            // 迎风程度：部件越靠前（在速度方向上），受热越多
            const proj = (wx * ux + wy * uy);
            const half = Math.max(SPEC.width, SPEC.height) / 2 || 1;
            return Math.max(0, Math.min(1, 0.5 + proj / (half * 2)));
        }

        // 每帧更新温度
        function updateHeat(dt) {
            const dens = atmosphereDensity(rocket.x, rocket.y);
            const sp = Math.hypot(rocket.vx, rocket.vy);

            // 关键：必须「朝地面冲」才算再入加热。
            // 只看速度的话，垂直起飞加速到几百 px/s 也会被当成再入，
            // 结果刚离地就把燃料箱烧穿了（这是个真 bug）。
            const rx = rocket.x - planet.x, ry = rocket.y - planet.y;
            const r = Math.hypot(rx, ry) || 1;
            const radialSpeed = (rocket.vx * rx + rocket.vy * ry) / r;   // >0 = 远离星球
            const divingIn = radialSpeed < -20;                          // 正在往下扎

            const hot = dens > 0.01 && sp > REENTRY_SPEED && divingIn;
            if (dens > 0.05 && sp > 400 && divingIn) unlock('meteor');
            let blew = 0;

            for (const p of shipDef.parts) {
                if (destroyed.has(p.id)) continue;
                if (hot) {
                    // 加热：速度、密度、迎风面三者相乘
                    const expo = partWindExposure(p);
                    const over = sp - REENTRY_SPEED;
                    // 系数调过：本星球大气只有 120m 厚，穿过它只要两三秒，
                    // 所以加热必须够猛，再入才真的能把部件烧穿。
                    const rate = over * over * 0.0016 * dens * (0.25 + expo * 1.6);
                    partTemp[p.id] += rate * dt;
                } else {
                    // 散热
                    const d = partTemp[p.id] - AMBIENT_TEMP;
                    if (d > 0) partTemp[p.id] -= Math.min(d, HEAT_COOL_RATE * dt);
                }
                // 到阈值就炸
                const limit = HEAT_LIMIT[p.type] || 800;
                if (partTemp[p.id] >= limit) {
                    destroyed.add(p.id);
                    blowUpPart(p);
                    blew++;
                }
            }
            if (blew > 0) {
                heatWrecked += blew;
                unlock('burned_up');
                checkSeparation();
                // 其它都烧光了，只剩控制舱
                const others = shipDef.parts.filter(p => p.type !== 'capsule');
                if (others.length > 0 &&
                    others.every(p => destroyed.has(p.id)) &&
                    hasWorkingCapsule()) {
                    unlock('capsule_survives');
                }
                toastQueue.push({
                    title: '再 入 警 报',
                    name: blew + ' 个部件因高温解体',
                    desc: '还有 ' + alivePartCount() + ' / ' + shipDef.parts.length + ' 个部件完好',
                });
            }
            return blew;
        }

        // 最热的那个部件（用于 HUD 显示）
        function hottestPart() {
            let best = null, bestT = -1;
            for (const p of shipDef.parts) {
                if (destroyed.has(p.id)) continue;
                const t = partTemp[p.id] || 0;
                if (t > bestT) { bestT = t; best = p; }
            }
            if (!best) return null;
            return { part: best, temp: bestT, limit: HEAT_LIMIT[best.type] || 800 };
        }

        // ==================== 大气层 ====================
        // 星球外面包一层大气：有阻力、有再入发光。
        // 厚度按半径的 15% 算（现实里只有 1.5%，但那样在屏幕上根本看不见）。
        // 厚度占半径的 60%。现实里大气只有半径的 1.5%，
        // 但本星球半径只有 200 m，按真实比例算出来只有 3 m 厚，
        // 屏幕上根本看不见，也没有「冲出大气」的感觉。
        const ATMO_RATIO = 0.60;            // 大气厚度占星球半径的比例
        const DRAG_COEF = 0.000010;         // 阻力系数（调大 = 空气更稠、掉得更快）
        const REENTRY_SPEED = 120;          // 超过这个速度冲进大气就开始发光

        function atmoThickness() { return planet.radius * ATMO_RATIO; }

        // HUD 上那行大气状态文字
        function atmoStatusText() {
            const r = Math.hypot(rocket.x - planet.x, rocket.y - planet.y);
            const alt = r - planet.radius;
            const h = atmoThickness();
            if (alt >= h) return '已飞出大气层 🌌';
            const pct = Math.round(atmosphereDensity(rocket.x, rocket.y) * 100);
            return `大气层内（空气密度 ${pct}%，层顶 ${fmtDistance(h)}）`;
        }

        // 某处的大气密度：0 = 真空，1 = 贴着地面
        function atmosphereDensity(x, y) {
            const r = Math.hypot(x - planet.x, y - planet.y);
            const alt = r - planet.radius;
            const h = atmoThickness();
            if (alt >= h || alt < 0) return 0;
            // 下半段稠密、上半段稀薄（用平方让过渡更自然）
            const t = 1 - alt / h;
            return t * t;
        }

        // 当前飞船所在位置的大气密度
        function myAtmosphere() {
            return atmosphereDensity(rocket.x, rocket.y);
        }
        // HUD 上那行再入温度提示
        function heatLine() {
            const h = hottestPart();
            if (!h || h.temp < AMBIENT_TEMP + 30) return '';
            const pct = Math.round(h.temp / h.limit * 100);
            const t = PART_TYPES[h.part.type];
            return `  🔥 ${t ? t.name : '部件'} ${Math.round(h.temp)}°C / ${h.limit}°C（${pct}%）`;
        }

        // 是否已经飞出大气
        function inSpace() {
            const r = Math.hypot(rocket.x - planet.x, rocket.y - planet.y);
            return (r - planet.radius) >= atmoThickness();
        }

        // ==================== 多航天器 ====================
        // 中间炸断之后，飞船会分离成好几截，每截都是独立航天器。
        // 为了不动那 147 处 rocket.xxx 的代码，这里保持一个约定：
        //   · rocket         = 当前正在操控的那一艘（有控制舱的）
        //   · vessels[]      = 全部航天器（包含 rocket 自己）
        //   · 失控的那些每帧只跑引力和惯性，不能操控
        let vessels = [];
        let activeVesselId = null;

        function makeVessel(parts, x, y, vx, vy, angle, fuel) {
            const def = { version: 1, name: '', parts: parts };
            const spec = shipSpec(def);
            return {
                id: 'v' + (vesselSeq++),
                def: def,
                spec: spec,
                x: x, y: y, vx: vx, vy: vy, angle: angle,
                fuel: fuel,
                throttle: 1,
                state: 'idle',
                landed: false,
                heat: 0,
                partHP: (function () { const h = {}; for (const p of parts) h[p.id] = PART_HP[p.type] || 80; return h; })(),
                partTemp: (function () { const t = {}; for (const p of parts) t[p.id] = AMBIENT_TEMP; return t; })(),
                destroyed: new Set(),
            };
        }
        let vesselSeq = 1;

        // 这艘船还有控制舱吗
        function vesselHasCapsule(v) {
            return v.def.parts.some(p => p.type === 'capsule' && !v.destroyed.has(p.id));
        }
        // 这艘船还有发动机吗
        function vesselHasEngine(v) {
            return v.def.parts.some(p => p.type === 'engine' && !v.destroyed.has(p.id));
        }
        // 这艘船的存活部件数
        function vesselAliveParts(v) {
            return v.def.parts.filter(p => !v.destroyed.has(p.id)).length;
        }
        // 这艘船当前的质量
        function vesselMass(v) {
            let dry = 0, cap = 0, thrust = 0;
            for (const p of v.def.parts) {
                if (v.destroyed.has(p.id)) continue;
                const t = PART_TYPES[p.type];
                if (!t) continue;
                dry += t.mass; cap += t.fuel; thrust += t.thrust;
            }
            return { dry, cap, thrust, total: dry + cap * v.fuel };
        }
        // 这艘船能不能被操控
        function vesselControllable(v) {
            return v && vesselHasCapsule(v) && !v.landed ? true : (v ? vesselHasCapsule(v) : false);
        }

        let wreckedCount = 0;         // 这一趟撞炸了几个部件
        let debris = [];              // 爆炸碎片（纯视觉）

        // 给每个部件建一份耐久表（和 shipDef.parts 一一对应）
        function initPartHP() {
            const hp = {};
            for (const p of shipDef.parts) hp[p.id] = PART_HP[p.type] || 80;
            return hp;
        }
        let partHP = initPartHP();
        let destroyed = new Set();    // 已经炸掉的部件 id

        // 撞了一下：按撞击速度给所有部件掉耐久，太狠的直接炸。
        // 用「单次撞击配额」避免连续弹跳把伤害累积起来 ——
        // 不然轻轻颠两下就把整艘船震碎了。
        let impactCooldown = 0;
        let impactBudget = {};       // 本次着陆每个部件最多掉多少血

        function resetImpactBudget() {
            impactBudget = {};
            for (const p of shipDef.parts) impactBudget[p.id] = 0;
        }
        resetImpactBudget();

        function applyImpact(speed) {
            if (speed < DAMAGE_SPEED) return 0;
            if (impactCooldown > 0) return 0;          // 刚撞过，这次不算
            impactCooldown = 0.35;                     // 0.35 秒内的连续碰撞只算一次

            // 撞击越狠伤害越大：低于 DAMAGE_SPEED 无伤，之后线性增长
            const over = speed - DAMAGE_SPEED;
            const dmg = over * 0.55;

            let blew = 0;
            for (const p of shipDef.parts) {
                if (destroyed.has(p.id)) continue;
                // 每个部件在本次着陆里的总伤害有上限，防止叠死
                const room = Math.max(0, (PART_HP[p.type] || 80) * 1.6 - (impactBudget[p.id] || 0));
                const real = Math.min(dmg * (0.6 + Math.random() * 0.8), room);
                impactBudget[p.id] = (impactBudget[p.id] || 0) + real;
                partHP[p.id] -= real;
                // 只有一次撞得特别狠（超过 DESTROY_SPEED）才当场炸
                if (speed > DESTROY_SPEED || partHP[p.id] <= 0) {
                    destroyed.add(p.id);
                    blowUpPart(p);
                    blew++;
                }
            }
            if (blew > 0) wreckedCount += blew;
            return blew;
        }

        // 炸完之后检查：船是不是断成几截了
        function checkSeparation() {
            if (findConnectedGroups(shipDef.parts, destroyed).length > 1) {
                splitVessel();
                if (vessels.length >= 3) unlock('derelict_keeper');
            }
        }

        // 爆炸：生成碎片；燃料箱炸了还会把里面的油一起烧掉
        function blowUpPart(p) {
            const t = PART_TYPES[p.type];
            if (!t) return;

            // 燃料箱被炸 → 它装的那部分油也没了。
            // 按「这个箱子占总燃料容量的比例」从当前油量里扣掉。
            if (t.fuel > 0 && SPEC.fuelCap > 0) {
                const share = t.fuel / SPEC.fuelCap;
                const lost = rocket.fuel * share;   // 当前油量里属于这个箱子的部分
                rocket.fuel = Math.max(0, rocket.fuel - lost);
                if (lost > 0.001) {
                    toastQueue.push({
                        title: '燃 料 损 失',
                        name: `燃料箱炸了，掉了 ${Math.round(lost * 100)}% 油`,
                        desc: `剩余燃料 ${Math.round(rocket.fuel * 100)}%`,
                    });
                }
                if (rocket.fuel <= 0 && rocket.state === 'firing') rocket.state = 'idle';
            }
            const P = PART_PX;
            const cx = (p.x + t.w / 2 - SPEC.centerX) * P;
            const cy = (SPEC.box.maxY - (p.y + t.h / 2)) * P;
            const world = shipPointWorld(cx, cy, rocket.angle);
            for (let i = 0; i < 14; i++) {
                const ang = Math.random() * Math.PI * 2;
                const sp = 40 + Math.random() * 160;
                debris.push({
                    x: world.x, y: world.y,
                    vx: rocket.vx + Math.cos(ang) * sp,
                    vy: rocket.vy + Math.sin(ang) * sp,
                    life: 1.6 + Math.random() * 1.4,
                    size: 1.5 + Math.random() * 2.5,
                    color: t.body,
                });
            }
        }

        // 碎片淡出
        function updateDebris(dt) {
            for (let i = debris.length - 1; i >= 0; i--) {
                const d = debris[i];
                d.life -= dt;
                if (d.life <= 0) { debris.splice(i, 1); continue; }
                d.x += d.vx * dt;
                d.y += d.vy * dt;
                const g = gravityAt(d.x, d.y);
                d.vx += g.ax * dt;
                d.vy += g.ay * dt;
            }
            if (debris.length > 400) debris.splice(0, debris.length - 400);
        }

        // 这一局开局时用的飞船（重置时回到它，而不是重新读 localStorage）
        let pristineShip = JSON.parse(JSON.stringify(shipDef));

        // 重置：把飞船放回地面，恢复燃料和部件（飞丢了、炸惨了、卡住了都能用）
        function respawnOnGround() {
            // 清掉所有失控航天器
            vessels = vessels.filter(v => v.id === activeVesselId);
            // 修好所有部件
            destroyed.clear();
            partHP = initPartHP();
            partTemp = initPartTemp();
            debris = [];
            wreckedCount = 0; heatWrecked = 0;
            resetImpactBudget();
            impactCooldown = 0;
            // 还原飞船定义（分离后 shipDef 可能被截断了）
            // 注意：这里要用「这一局开局时的船」，不能重新读 localStorage ——
            // 否则玩家在造船厂造的船会被默认船覆盖掉。
            shipDef = JSON.parse(JSON.stringify(pristineShip));
            SPEC = shipSpec(shipDef);
            const main = vessels.find(v => v.id === activeVesselId);
            if (main) { main.def = shipDef; main.spec = SPEC; }
            // 满油落地
            rocket.fuel = 1;
            rocket.throttle = 1;
            rocket.state = 'idle';
            rocket.angle = 90;
            rocket.vx = 0; rocket.vy = 0;
            rocket.heat = 0;
            stats.escapedFar = false;
            placeOnSurface();
            if (main) {
                main.x = rocket.x; main.y = rocket.y;
                main.vx = 0; main.vy = 0; main.landed = true;
                main.fuel = 1; main.destroyed = destroyed;
            }
            toastQueue.push({
                title: '重 新 开 始',
                name: '飞船已修复并放回地面',
                desc: '燃料满格，部件全好',
            });
        }

        // ==================== 分离 ====================
        // 中间炸断了，船就断成两截（甚至更多）。
        // 用「并查集」找出哪些部件还连在一起 —— 挨着的算同一截。
        function findConnectedGroups(parts, destroyed) {
            const alive = parts.filter(p => !destroyed.has(p.id));
            const parent = {};
            for (const p of alive) parent[p.id] = p.id;
            function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
            function union(a, b) { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }

            // 两个部件的格子区域是否相邻（含重叠）
            function touching(a, b) {
                const ta = PART_TYPES[a.type], tb = PART_TYPES[b.type];
                if (!ta || !tb) return false;
                const aL = a.x, aR = a.x + ta.w, aB = a.y, aT = a.y + ta.h;
                const bL = b.x, bR = b.x + tb.w, bB = b.y, bT = b.y + tb.h;
                // 允许 1 格容差（斜对角也算连着）
                return aL <= bR + 1 && aR >= bL - 1 && aB <= bT + 1 && aT >= bB - 1;
            }

            for (let i = 0; i < alive.length; i++) {
                for (let j = i + 1; j < alive.length; j++) {
                    if (touching(alive[i], alive[j])) union(alive[i].id, alive[j].id);
                }
            }
            const groups = {};
            for (const p of alive) {
                const r = find(p.id);
                (groups[r] = groups[r] || []).push(p);
            }
            return Object.values(groups);
        }

        // 把当前飞船按「还连在一起的部件」拆成若干航天器
        // 返回新产生的那些（不含仍然操控中的那艘）
        function splitVessel() {
            const groups = findConnectedGroups(shipDef.parts, destroyed);
            if (groups.length <= 1) return [];

            // 挑出有控制舱的那组当主角；没有就挑最大的那组
            let mainIdx = groups.findIndex(g => g.some(p => p.type === 'capsule'));
            if (mainIdx < 0) {
                let best = 0;
                groups.forEach((g, i) => { if (g.length > groups[best].length) best = i; });
                mainIdx = best;
            }

            const born = [];
            groups.forEach((g, i) => {
                if (i === mainIdx) {
                    // 主控那截：留在 rocket 里继续用
                    shipDef = { version: 1, name: shipDef.name, parts: g };
                    SPEC = shipSpec(shipDef);
                    // 燃料容量变了：油量按「占新容量的比例」重新归一
                    const newCap = g.reduce((s, p) => s + (PART_TYPES[p.type] ? PART_TYPES[p.type].fuel : 0), 0);
                    const oldCap = SPEC.fuelCap || 1;
                    rocket.fuel = Math.max(0, Math.min(1, rocket.fuel * oldCap / Math.max(1e-6, newCap)));
                    // 同步更新登记在 vessels 里的主船记录
                    for (const v of vessels) {
                        if (v.id === activeVesselId) {
                            v.def = shipDef;
                            v.spec = SPEC;
                        }
                    }
                    return;
                }
                // 其它截：变成失控的航天器，按质心位置分开一点点
                const spec = shipSpec({ version: 1, parts: g });
                // 相对主控的偏移 → 世界坐标
                const offX = (spec.centerX - SPEC.centerX) * PART_PX;
                const offY = -(spec.com.y - SPEC.com.y);
                const a = (rocket.angle - 90) * Math.PI / 180;
                const wx = rocket.x + offX * Math.cos(a);
                const wy = rocket.y + offX * Math.sin(a);
                const v = makeVessel(g, wx, wy, rocket.vx, rocket.vy, rocket.angle, rocket.fuel);
                vessels.push(v);
                born.push(v);
            });

            // 分离本身给两边一点推开的力
            const push = 30;
            rocket.vx += (Math.random() - 0.5) * push;
            rocket.vy += (Math.random() - 0.5) * push;
            for (const v of born) {
                v.vx -= (Math.random() - 0.5) * push;
                v.vy -= (Math.random() - 0.5) * push;
            }

            toastQueue.push({
                title: '结 构 分 离',
                name: '飞船断成 ' + groups.length + ' 截',
                desc: born.length + ' 截失控，只有带控制舱的那截能操控',
            });
            unlock('split_vessel');
            if (vessels.length >= 3) unlock('derelict_keeper');
            return born;
        }

        // 更新那些失控的航天器（只有引力和惯性，不能操控）
        function updateDerelicts(dt) {
            for (const v of vessels) {
                if (v.id === activeVesselId) continue;
                if (v.landed) continue;
                const g = gravityAt(v.x, v.y);
                v.vx += g.ax * dt;
                v.vy += g.ay * dt;
                // 大气阻力
                const dens = atmosphereDensity(v.x, v.y);
                if (dens > 0) {
                    const sp = Math.hypot(v.vx, v.vy);
                    if (sp > 1) {
                        const drag = DRAG_COEF * dens * sp * sp;
                        v.vx -= (v.vx / sp) * drag * dt;
                        v.vy -= (v.vy / sp) * drag * dt;
                    }
                }
                v.x += v.vx * dt;
                v.y += v.vy * dt;
                // 撞地就停住
                const hit = lowestCollisionPointFor(v, v.angle);
                if (hit && hit.dist > 0 && hit.dist < planet.radius) {
                    const push = planet.radius - hit.dist;
                    const ux = (hit.world.x - planet.x) / hit.dist;
                    const uy = (hit.world.y - planet.y) / hit.dist;
                    v.x += ux * push;
                    v.y += uy * push;
                    v.vx *= -0.15;
                    v.vy *= -0.15;
                    if (Math.hypot(v.vx, v.vy) < 12) {
                        v.vx = 0; v.vy = 0; v.landed = true;
                    }
                }
            }
        }

        // 任意一艘船的碰撞检测（和主船同一套逻辑，只是换了对象）
        function lowestCollisionPointFor(v, angleDeg) {
            let best = null, bestD = Infinity;
            for (const p of v.spec.corners) {
                const a = (angleDeg - 90) * Math.PI / 180;
                const rx = p.x - v.spec.com.x, ry = p.y - v.spec.com.y;
                const wx = v.x + rx * Math.cos(a) - ry * Math.sin(a);
                const wy = v.y + rx * Math.sin(a) + ry * Math.cos(a);
                const dx = wx - planet.x, dy = wy - planet.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < bestD) { bestD = d; best = { local: p, world: { x: wx, y: wy }, dist: d }; }
            }
            return best;
        }

        // 还有多少个部件活着
        function alivePartCount() {
            return shipDef.parts.filter(p => !destroyed.has(p.id)).length;
        }
        // 还有发动机吗（没了就飞不动了）
        function hasWorkingEngine() {
            return shipDef.parts.some(p => p.type === 'engine' && !destroyed.has(p.id));
        }
        function hasWorkingCapsule() {
            return shipDef.parts.some(p => p.type === 'capsule' && !destroyed.has(p.id));
        }
        const GROUND_FRICTION = 0.85; // 贴地摩擦：停在地上时横向速度每帧乘这个数

        // 日志计时器
        let lastLogTime = 0;
        const LOG_INTERVAL = 1000; // 每秒输出一次日志

        // ==== 键盘监听（所有操作都有对应的键）====
        // A/D 旋转、↑/↓ 油门，都用“按住”状态，在 physicsStep 里按时间处理，又快又稳
        const keys = { left: false, right: false, throttleUp: false, throttleDown: false, fine: false, refuel: false, dump: false, zoomIn: false, zoomOut: false };

        // 观战端：除了音乐、成就、协同面板，其它按键一律不生效
        function spectatorAllows(code) {
            return code === 'KeyM' || code === 'KeyC' || code === 'KeyT' || code === 'KeyS' || code === 'KeyL';
        }

        function onKeyDown(e) {
            if (isSpectator() && !spectatorAllows(e.code)) return;
            if (e.code === 'KeyA') { keys.left = true; return; }
            if (e.code === 'KeyD') { keys.right = true; return; }
            if (e.code === 'ArrowUp') { keys.throttleUp = true; e.preventDefault(); return; }
            if (e.code === 'ArrowDown') { keys.throttleDown = true; e.preventDefault(); return; }
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { keys.fine = true; return; }
            // 燃料：+ 加油、- 卸油（按住会持续加减）
            if (e.code === 'Equal' || e.code === 'NumpadAdd') { keys.refuel = true; return; }
            if (e.code === 'Minus' || e.code === 'NumpadSubtract') { keys.dump = true; return; }
            // 缩放：[ 缩小、] 放大（按住会持续缩放）
            if (e.code === 'BracketLeft') { keys.zoomOut = true; return; }
            if (e.code === 'BracketRight') { keys.zoomIn = true; return; }
            if (e.code === 'KeyC') { toggleAchievementPanel(); return; }
            if (e.code === 'KeyM') { toggleBgm(); return; }
            if (e.code === 'KeyR') { respawnOnGround(); return; }
            if (e.code === 'KeyT') { toggleTouchPanel(); return; }
            if (e.repeat) return;   // 长按不重复触发下面这些，避免状态乱闪
            if (e.code === 'KeyE') toggleEngine();
            if (e.code === 'KeyS') saveGame();
            if (e.code === 'KeyL') loadGame();
        }

        function onKeyUp(e) {
            if (e.code === 'KeyA') keys.left = false;
            if (e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowUp') keys.throttleUp = false;
            if (e.code === 'ArrowDown') keys.throttleDown = false;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.fine = false;
            if (e.code === 'Equal' || e.code === 'NumpadAdd') keys.refuel = false;
            if (e.code === 'Minus' || e.code === 'NumpadSubtract') keys.dump = false;
            if (e.code === 'BracketLeft') keys.zoomOut = false;
            if (e.code === 'BracketRight') keys.zoomIn = false;
        }

        // 键盘和屏幕按键都走这两个函数，两条输入路径永远一致
        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);

        // 切走窗口时松开所有键，免得回来飞船还在自己转、油门自己往上涨
        window.addEventListener('blur', () => {
            keys.left = false;
            keys.right = false;
            keys.throttleUp = false;
            keys.throttleDown = false;
            keys.fine = false;
            keys.refuel = false;
            keys.dump = false;
            keys.zoomIn = false;
            keys.zoomOut = false;
        });

        // ==================== 触控按键 ====================
        // 屏幕按键“按下” = 按下对应的键，所以键鼠和触控能做到的事完全一样
        const touchButtons = [
            ['t-left', 'KeyA'], ['t-right', 'KeyD'],
            ['t-thr-up', 'ArrowUp'], ['t-thr-down', 'ArrowDown'],
            ['t-ignite', 'KeyE'],
            ['t-zoom-in', 'BracketRight'], ['t-zoom-out', 'BracketLeft'],
            ['t-fuel', 'Equal'], ['t-dump', 'Minus'],
        ];

        touchButtons.forEach((pair) => {
            const btn = document.getElementById(pair[0]);
            if (!btn || !btn.addEventListener) return;
            const code = pair[1];
            const press = (ev) => {
                if (ev && ev.preventDefault) ev.preventDefault();
                if (isSpectator() && !spectatorAllows(code)) return;   // 观战端不能操控
                if (btn.classList) btn.classList.add('active');
                startBgm();     // 手机上第一次摸屏幕，顺便把音乐带起来
                onKeyDown({ code: code, repeat: false, shiftKey: false, preventDefault() {} });
            };
            const release = (ev) => {
                if (ev && ev.preventDefault) ev.preventDefault();
                if (btn.classList) btn.classList.remove('active');
                onKeyUp({ code: code });
            };
            btn.addEventListener('pointerdown', press);
            btn.addEventListener('pointerup', release);
            btn.addEventListener('pointercancel', release);
            btn.addEventListener('pointerleave', release);
            btn.addEventListener('contextmenu', (ev) => { if (ev.preventDefault) ev.preventDefault(); });
        });

        // “微调”是个开关（键盘上是按住 Shift），触控点一下就切换
        const fineBtn = document.getElementById('t-fine');
        if (fineBtn && fineBtn.addEventListener) {
            fineBtn.addEventListener('pointerdown', (ev) => {
                if (ev && ev.preventDefault) ev.preventDefault();
                keys.fine = !keys.fine;
                if (fineBtn.classList) {
                    if (keys.fine) fineBtn.classList.add('active');
                    else fineBtn.classList.remove('active');
                }
            });
        }

        // 触控面板：触屏设备默认打开；桌面按 T 或点右上角「触控」开关
        const isTouchDevice = (typeof navigator !== 'undefined' && (navigator.maxTouchPoints || 0) > 0) || ('ontouchstart' in window);
        let touchPanelOn = isTouchDevice;
        try {
            const savedTouch = localStorage.getItem('msp2d-touch');
            if (savedTouch === '1') touchPanelOn = true;
            if (savedTouch === '0') touchPanelOn = false;
        } catch (e) {}

        function applyTouchPanel() {
            if (touchControlsEl) touchControlsEl.style.display = touchPanelOn ? 'block' : 'none';
        }

        function toggleTouchPanel() {
            touchPanelOn = !touchPanelOn;
            try { localStorage.setItem('msp2d-touch', touchPanelOn ? '1' : '0'); } catch (e) {}
            applyTouchPanel();
        }

        applyTouchPanel();

        // ==== 发动机状态机（冷启动已去掉：按 E 直接点火 / 关机） ====
        function toggleEngine() {
            if (rocket.state === 'firing') {
                rocket.state = 'idle';        // 关机
            } else {
                if (rocket.landed) {
                    unlock('first_flight');
                    stats.launchX = rocket.x; // 记下起飞点，着陆时用来算飞了多远
                    stats.launchY = rocket.y;
                    stats.escaped = false;    // “迷路的猫”只算同一次飞行：逃逸了又自己回来
                    resetImpactBudget();      // 新的一趟，重新计算能承受的撞击
                }
                rocket.state = 'firing';      // 点火；停在星球上按就是重新起飞
                rocket.landed = false;
            }
        }

        // ==== 缩放（滚轮，或键盘 - / =）====
        // 缩放。步进是「自适应」的：缩得越小，每步跨度越大。
        // 不然从 0.5 缩到 0.012 要滚 35 次，手都要断了。
        // 做法：把 factor 相对 1 的偏差按当前缩放级别放大。
        function zoomBy(factor) {
            const span = Math.log(camera.maxZoom / camera.minZoom);
            // 当前处在整个缩放范围的位置（0 = 最近，1 = 最远）
            const depth = Math.log(camera.zoom / camera.minZoom) / span;
            const boost = 1 + depth * 6;            // 越远步子越大
            const f = 1 + (factor - 1) * boost;
            camera.zoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, camera.zoom * f));
            // 放宽判定：缩放范围跨了 500 倍，浮点误差会累积，
            // 用 1e-6 这种绝对值判「到底了」根本判不到。
            // 改成按范围比例判：到了最小值的 1.02 倍以内就算到底。
            if (camera.zoom <= camera.minZoom * 1.02) unlock('zoom_min');
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoomBy(e.deltaY > 0 ? 0.9 : 1.1);
        }, { passive: false });

        // ==================== 双指捏合缩放（手机 / 触摸屏）====================
        // 和按钮、滚轮走的是同一个 zoomBy，所以三种方式效果完全一样
        const activePointers = new Map();   // 每根手指的当前位置
        let pinchStartDist = 0;
        let pinchStartZoom = 1;

        function pointerDistance() {
            const pts = [...activePointers.values()];
            if (pts.length < 2) return 0;
            const dx = pts[0].x - pts[1].x;
            const dy = pts[0].y - pts[1].y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        canvas.addEventListener('pointerdown', (e) => {
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (activePointers.size === 2) {
                pinchStartDist = pointerDistance();
                pinchStartZoom = camera.zoom;
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!activePointers.has(e.pointerId)) return;
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (activePointers.size >= 2 && pinchStartDist > 0) {
                if (e.preventDefault) e.preventDefault();
                const ratio = pointerDistance() / pinchStartDist;
                // 直接按手指间距的比例缩放，跟手
                camera.zoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, pinchStartZoom * ratio));
                if (camera.zoom <= camera.minZoom * 1.02) unlock('zoom_min');
            }
        });

        function endPointer(e) {
            activePointers.delete(e.pointerId);
            if (activePointers.size < 2) pinchStartDist = 0;
        }
        canvas.addEventListener('pointerup', endPointer);
        canvas.addEventListener('pointercancel', endPointer);
        canvas.addEventListener('pointerleave', endPointer);

        // ==== 引力：平方反比（真正的轨道引力）====
        // a = surfaceGravity × (radius / 距离)²
        // 这里不用另外加“离心力”：我们用的是不跟着飞船转的坐标系，
        // 只要横向速度够快，飞船就会一直“绕着、掉不到地上”—— 这就是轨道。
        function gravityAt(x, y) {
            const dx = planet.x - x;
            const dy = planet.y - y;
            const dist = Math.sqrt(dx*dx + dy*dy) || 1;
            const safe = Math.max(dist, planet.radius * 0.5);   // 防止贴到球心时引力爆表
            const a = planet.surfaceGravity * (planet.radius / safe) ** 2;
            return { ax: (dx / dist) * a, ay: (dy / dist) * a, dist };
        }

        // ==== 物理更新 ====
        function physicsStep(dt) {
            // 旋转放在最前面：停在地上也能先转好方向，再点火起飞
            if (keys.left) rocket.angle -= ROTATE_SPEED * dt;
            if (keys.right) rocket.angle += ROTATE_SPEED * dt;
            rocket.angle = ((rocket.angle % 360) + 360) % 360;

            // 缩放：按住 [ / ] 持续缩放（和滚轮、双指捏合同一个 zoomBy）
            if (keys.zoomIn || keys.zoomOut) {
                const zoomFactor = Math.pow(1 + ZOOM_RATE_PER_SEC, dt);
                if (keys.zoomIn) zoomBy(zoomFactor);
                if (keys.zoomOut) zoomBy(1 / zoomFactor);
            }

            // 节流阀：按住 ↑/↓ 调油门，按住 Shift 变成微调
            const rate = keys.fine ? THROTTLE_FINE_RATE : THROTTLE_RATE;
            if (keys.throttleUp) rocket.throttle = Math.min(1, rocket.throttle + rate * dt);
            if (keys.throttleDown) rocket.throttle = Math.max(0, rocket.throttle - rate * dt);
            if (keys.fine && (keys.throttleUp || keys.throttleDown)) unlock('fine_tune');

            // 加油 / 卸油：只能停在星球上的时候做（在空中按只会提醒你）
            if (keys.refuel || keys.dump) {
                if (rocket.landed) {
                    if (keys.refuel) {
                        rocket.fuel = Math.min(1, rocket.fuel + FUEL_FILL_RATE * dt);
                        if (rocket.fuel >= 1) unlock('refuel_full');
                    }
                    if (keys.dump) {
                        const before = rocket.fuel;
                        rocket.fuel = Math.max(0, rocket.fuel - FUEL_FILL_RATE * dt);
                        stats.dumpedFuel += before - rocket.fuel;
                        if (stats.dumpedFuel >= 0.5) unlock('dump_half');
                    }
                    fuelMsgTimer = 0;
                } else {
                    fuelMsgTimer = 2;
                }
            }
            if (fuelMsgTimer > 0) fuelMsgTimer -= dt;

            // 引力
            const g = gravityAt(rocket.x, rocket.y);
            rocket.vx += g.ax * dt;
            rocket.vy += g.ay * dt;

            // 发动机烧燃料：油门越大烧得越快；燃料烧完就自动熄火
            let thrusting = false;
            if (rocket.state === 'firing' && rocket.throttle > 0) {
                if (rocket.fuel > 0) {
                    thrusting = true;
                    rocket.fuel = Math.max(0, rocket.fuel - rocket.throttle * dt / FUEL_BURN_SECONDS);
                    if (rocket.fuel <= 0) {
                        rocket.state = 'idle';                          // 没油了，熄火
                        if (!rocket.landed) unlock('out_of_fuel');      // 在天上烧干 = 弹尽粮绝
                    }
                } else {
                    rocket.state = 'idle';
                }
            }

            if (thrusting) {
                // 推力沿着“船头”方向 (-cos, -sin)，大小 = 满油推力 × 油门 ÷ 当前质量。
                // 油烧掉一半，飞船就轻了，同样油门能推得更猛 —— 这就是“燃料减少重量也减少”。
                const a = rocket.angle * Math.PI / 180;
                const power = thrustAccel(rocket.fuel, rocket.throttle);
                rocket.vx += -Math.cos(a) * power * dt;
                rocket.vy += -Math.sin(a) * power * dt;
            }

            // ---- 空气阻力：只在大气层内有效，速度越快、密度越大，减速越狠 ----
            const dens = atmosphereDensity(rocket.x, rocket.y);
            let heating = 0;
            if (dens > 0) {
                const sp = Math.hypot(rocket.vx, rocket.vy);
                if (sp > 1) {
                    const drag = DRAG_COEF * dens * sp * sp;
                    rocket.vx -= (rocket.vx / sp) * drag * dt;
                    rocket.vy -= (rocket.vy / sp) * drag * dt;
                }
                // 再入加热：高速冲进稠密大气
                if (sp > REENTRY_SPEED) {
                    heating = Math.min(1, (sp - REENTRY_SPEED) / 400) * dens * 3;
                }
            }
            rocket.heat = heating;

            rocket.x += rocket.vx * dt;
            rocket.y += rocket.vy * dt;

            // ==== 着陆判定（按碰撞箱，不再把飞船当成一个点）====
            // 找出整艘船上离星球中心最近的那个点：
            // 船头朝上垂直落地时是喷口先着地，斜着落是侧面先着地，
            // 所以船不会插进地里，也不会悬在半空。
            // 防穿地：一帧位移超过半个船身时，把这一步拆成几个小步走，
            // 免得高速下落时「一步跨过地面」，直接穿到星球里面去。
            // 上面已经按整帧加过一次位移了，所以这里先退回来，再按小步重新走。
            const fullMoveX = rocket.vx * dt;
            const fullMoveY = rocket.vy * dt;
            const moveLen = Math.hypot(fullMoveX, fullMoveY);
            const maxStep = Math.max(4, PART_PX * 0.5);
            if (moveLen > maxStep) {
                rocket.x -= fullMoveX;
                rocket.y -= fullMoveY;
                const sub = Math.min(8, Math.ceil(moveLen / maxStep));
                const sdt = dt / sub;
                for (let i = 0; i < sub; i++) {
                    rocket.x += rocket.vx * sdt;
                    rocket.y += rocket.vy * sdt;
                    const h2 = lowestCollisionPoint(rocket.angle);
                    if (h2 && h2.dist > 0 && h2.dist < planet.radius) break;
                }
            }

            const hit = lowestCollisionPoint(rocket.angle);

            if (hit && hit.dist > 0 && hit.dist < planet.radius) {
                // 1) 把船整体推回去，让那个碰撞点正好贴在地表
                const push = planet.radius - hit.dist;
                const ux = (hit.world.x - planet.x) / hit.dist;   // 从球心指向那个点
                const uy = (hit.world.y - planet.y) / hit.dist;
                rocket.x += ux * push;
                rocket.y += uy * push;

                // 2) 用同一个方向分解速度
                const nx = -ux, ny = -uy;                        // 指回球心
                const intoGround = rocket.vx * nx + rocket.vy * ny;   // >0 表示正在往地里扎
                const slideX = rocket.vx - intoGround * nx;
                const slideY = rocket.vy - intoGround * ny;

                // 结结实实砸了一下 —— 不管接下来是弹起来还是停住，都算数
                if (intoGround > 250) unlock('hard_landing');

                // ---- 撞击损毁：撞太狠就震坏 / 炸掉部件，并吃掉一部分速度 ----
                if (intoGround > DAMAGE_SPEED) {
                    const blew = applyImpact(intoGround);
                    if (blew > 0) {
                        unlock('true_hard_landing');
                        toastQueue.push({
                            title: '撞 击 警 报',
                            name: blew + ' 个部件被撞毁',
                            desc: '还有 ' + alivePartCount() + ' / ' + shipDef.parts.length + ' 个部件完好',
                        });
                    }
                    // 撞击消耗能量：残骸越破，速度掉得越多
                    const wreckRatio = 1 - alivePartCount() / Math.max(1, shipDef.parts.length);
                    const damp = Math.max(0.25, 0.75 - wreckRatio * 0.5);
                    rocket.vx *= damp;
                    rocket.vy *= damp;
                    // 没发动机了就彻底飞不起来
                    if (!hasWorkingEngine() && rocket.state === 'firing') rocket.state = 'idle';
                    // 炸断了吗？
                    if (blew > 0) checkSeparation();
                }

                // 摔得狠、而且发动机没在推 → 弹一下，把大部分能量吃掉。
                // 但如果你正点火往地里顶，就直接停住 —— 不然会一直弹个没完，永远落不下来。
                if (intoGround > LANDING_SPEED && rocket.state !== 'firing') {
                    // 摔得太狠：弹一下，大部分能量被吃掉
                    rocket.vx = slideX * 0.8 - intoGround * 0.2 * nx;
                    rocket.vy = slideY * 0.8 - intoGround * 0.2 * ny;
                    rocket.landed = false;
                } else {
                    // 没点火、稳稳停在地上：扎向地面的速度归零，
                    // 贴着地面滑的速度被摩擦慢慢磨掉，但"向外飞"的速度要留着
                    // —— 不然停在星球上就再也起不来了。
                    // 「向外飞」的速度原样保留（起飞靠它，不能被摩擦吃掉）；
                    // 「贴着地面滑」的速度才吃摩擦。
                    const outSpeed = Math.max(0, -intoGround);
                    rocket.vx = slideX * GROUND_FRICTION - outSpeed * nx;
                    rocket.vy = slideY * GROUND_FRICTION - outSpeed * ny;

                    if (!rocket.landed) {
                        rocket.landed = true;
                        // 落地自动关机，等着按 E 重新起飞
                        if (rocket.state === 'firing') rocket.state = 'idle';

                        // ---- 着陆相关的成就 ----
                        if (intoGround < 20) unlock('soft_landing');    // 轻轻落下
                        if (intoGround < 5) unlock('no_scratch');       // 毫发无伤
                        if (alivePartCount() < shipDef.parts.length / 2) unlock('survive_wreck');  // 残骸归来
                        if (rocket.fuel < 0.05) unlock('low_fuel_land');// 快没油了还能落回来
                        if (stats.escaped) unlock('homing_cat');        // 飞出去又自己回来了
                        if (Math.hypot(rocket.x - stats.launchX, rocket.y - stats.launchY) > 3000) {
                            unlock('round_trip');                       // 落点离起飞点很远
                        }
                        stats.escaped = false;

                        // 着陆结算：这一趟任务里拿到的成就一次性揭晓
                        settleMission();
                    }
                }
            } else {
                // 离开地面 = 自由飞行
                rocket.landed = false;
            }

            // 质心随燃料变化：油烧掉，重心会往船头偏（真实火箭也是这样）。
            // 每帧重算一次（部件不多，开销可以忽略）。
            SPEC.com = shipCenterOfMass(shipDef, SPEC, rocket.fuel);

            // 失控的航天器（惯性飞行，不能操控）
            updateDerelicts(dt);

            // 边界保护：飞出行星系统太远时给个提示，别让玩家莫名其妙一直飘
            {
                const r = Math.hypot(rocket.x - planet.x, rocket.y - planet.y);
                const farLimit = planet.radius * 60;
                if (r > farLimit && !stats.escapedFar) {
                    stats.escapedFar = true;
                    toastQueue.push({
                        title: '脱 离 引 力 范 围',
                        name: '你飞出了行星系统',
                        desc: '没有回头路了 —— 回不去的话按 R 重开这一趟',
                    });
                } else if (r < farLimit * 0.8) {
                    stats.escapedFar = false;
                }
            }

            // 再入加热 + 碎片 + 撞击冷却
            updateHeat(dt);
            updateDebris(dt);
            if (impactCooldown > 0) impactCooldown -= dt;

            // 成就检查 + 弹出横幅
            checkAchievements(dt);
            updateAchievementToast(dt);
        }

        // ==== 轨道预测线（虚线）====
