<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSP2D - 猫咪航天局</title>
    <style>
        /* ==================== 设计 tokens ==================== */
        :root {
            --panel: rgba(10, 16, 28, .82);          /* 玻璃面板底 */
            --panel-solid: rgba(8, 13, 24, .95);     /* 弹层（更实一点） */
            --line: #2a3f5f;                         /* 1px 边框 */
            --line-soft: rgba(42, 63, 95, .55);      /* 面板内分隔线 */
            --blue: #4a90d9;
            --amber: #ffc35c;
            --red: #ff6a6a;
            --green: #45c46e;
            --text: #dce8f7;
            --dim: #6b86a6;
            --mono: ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
            --sans: 'Segoe UI', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --shadow: 0 2px 16px rgba(0, 0, 0, .35);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        /* 画布铺满整个窗口：宇宙必须填满屏幕，按钮和 HUD 浮在它上面。 */
        body { margin: 0; background: #05070d; height: 100vh; overflow: hidden; position: relative;
               font-family: var(--sans); color-scheme: dark; }
        /* 画布自适应：手机上自动缩放到装得下，触控不要触发滚动/双指缩放 */
        canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; display: block;
            border: none; touch-action: none;
        }

        /* ==================== 左上：飞行数据面板 + 部件栏 ==================== */
        #top-left {
            position: absolute; top: 10px; left: 10px;
            z-index: 5; pointer-events: none;
            display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
        }
        /* 飞行数据 HUD：经典终端风文本块（js/main.js 写 innerText，按信息
           层级分行；宽度自适应、超长自动折行不丢字） */
        #hud {
            color: #0f0;
            font-family: ui-monospace, Consolas, 'Courier New', monospace;
            font-size: 13px; line-height: 1.6;
            text-shadow: 1px 1px 2px #000;
            white-space: pre-wrap; word-break: break-all;
            width: clamp(300px, calc(100vw - 470px), 560px);
        }
        #hud:empty { display: none; }

        /* ==================== 部件栏 ==================== */
        /* 跟在数据面板下面；chips 由 js/main.js 生成（class 名固定） */
        #parts-bar {
            pointer-events: none; white-space: nowrap;
            width: max-content; max-width: min(720px, calc(100vw - 20px));
            display: flex; align-items: center; gap: 5px;
            font-family: var(--sans); font-size: 12px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
            box-shadow: var(--shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            padding: 6px 10px;
            overflow-x: auto; scrollbar-width: none;
        }
        #parts-bar::-webkit-scrollbar { display: none; }
        #parts-bar .p {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 2px 8px; border-radius: 5px;
            border: 1px solid; line-height: 1.5; font-size: 11.5px;
        }
        #parts-bar .p .dot { width: 7px; height: 7px; border-radius: 50%; }
        #parts-bar .p .hp { font-family: var(--mono); font-size: 10px; opacity: .75; }
        /* 完好 */
        #parts-bar .ok { color: #9fd8ae; border-color: rgba(69, 196, 110, .45); background: rgba(69, 196, 110, .08); }
        #parts-bar .ok .dot { background: var(--green); }
        /* 受损 */
        #parts-bar .hurt { color: var(--amber); border-color: rgba(255, 195, 92, .45); background: rgba(255, 195, 92, .07); }
        #parts-bar .hurt .dot { background: #e0a020; }
        /* 正在烧 */
        #parts-bar .hot { color: #ffb37a; border-color: rgba(255, 106, 26, .5); background: rgba(255, 106, 26, .08);
                          animation: pulse .7s ease-in-out infinite; }
        #parts-bar .hot .dot { background: #ff6a1a; }
        /* 已毁 */
        #parts-bar .gone { color: #5d5560; border-color: rgba(93, 85, 96, .5); background: rgba(93, 85, 96, .1);
                           text-decoration: line-through; opacity: .75; }
        #parts-bar .gone .dot { background: #4a3a40; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
        #parts-bar .summary {
            color: #8fb4dc; padding-left: 8px; margin-left: 2px;
            border-left: 1px solid var(--line-soft);
        }
        #parts-bar .warn { color: var(--red); font-weight: 600; }

        /* ==================== 右上：时间倍率胶囊 + 系统按钮 ==================== */
        #top-buttons {
            position: absolute; top: 10px; right: 10px; z-index: 6;
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
            pointer-events: none;
        }
        #top-buttons > * { pointer-events: auto; }
        /* 时间倍率：独立胶囊（− / 档位 / +） */
        #time-btn {
            display: flex; align-items: center; gap: 2px;
            padding: 3px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 999px; box-shadow: var(--shadow);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        #time-btn button {
            width: 30px; height: 28px; border: none; background: transparent;
            color: var(--dim); font-size: 15px; font-family: var(--mono);
            border-radius: 999px; cursor: pointer;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        #time-btn button:hover { background: rgba(74, 144, 217, .18); color: var(--text); }
        #time-btn button:active { background: rgba(74, 144, 217, .3); }
        #time-value {
            min-width: 56px; text-align: center; padding: 5px 0;
            font-family: var(--mono); font-size: 13px; font-weight: 600;
            color: var(--text); background: rgba(74, 144, 217, .12);
            border: 1px solid var(--line); border-radius: 999px;
        }
        /* 加速档位提示：fast = 中速档，ultra = 极速档 */
        #time-value.fast { color: var(--amber); border-color: rgba(255, 195, 92, .45); background: rgba(255, 195, 92, .1); }
        #time-value.ultra { color: var(--red); border-color: rgba(255, 106, 106, .5); background: rgba(255, 106, 106, .1);
                            animation: pulse .9s ease-in-out infinite; }
        /* 系统按钮：一行紧凑图标 + 文字 */
        .sys-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 72vw; }
        .sys-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 11px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 8px; color: var(--text); font-family: var(--sans); font-size: 12px;
            cursor: pointer; box-shadow: var(--shadow);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        .sys-btn svg {
            width: 13px; height: 13px; flex: none;
            stroke: var(--dim); fill: none; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .sys-btn:hover { border-color: var(--blue); }
        .sys-btn:hover svg { stroke: var(--blue); }
        .sys-btn:active { background: rgba(74, 144, 217, .15); }

        /* ==================== 左右：油门 / 燃料 竖条 ==================== */
        #throttle-bar, #fuel-bar {
            position: absolute; bottom: 208px; width: 18px; height: 172px; z-index: 4;
            background: rgba(10, 16, 28, .55);
            border: 1px solid var(--line); border-radius: 7px; overflow: hidden;
        }
        #throttle-bar { left: 16px; }
        #fuel-bar { right: 16px; }
        /* 刻度线（每 1/4 一格），盖在填充上面 */
        #throttle-bar::after, #fuel-bar::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(to top,
                transparent 0 42px, rgba(220, 232, 247, .16) 42px 43px);
        }
        /* 填充高度/颜色由 js/main.js 直接写内联样式，这里只给默认色 */
        #throttle-fill {
            position: absolute; left: 0; bottom: 0; width: 100%; height: 100%;
            background: var(--amber); opacity: .9;
        }
        #fuel-fill {
            position: absolute; left: 0; bottom: 0; width: 100%; height: 100%;
            background: var(--blue); opacity: .9;
        }
        #throttle-text {
            position: absolute; left: 16px; bottom: 388px;
            color: var(--amber); font-family: var(--mono); font-size: 12px;
        }
        #fuel-text {
            position: absolute; right: 16px; bottom: 388px; width: 300px;
            color: #7fb8e8; font-family: var(--mono); font-size: 12px;
            text-align: right; white-space: pre-line; line-height: 1.6;
        }

        /* ==================== 成就横幅 + 成就面板 ==================== */
        #achievement {
            position: absolute; top: 22px; left: 50%;
            transform: translateX(-50%) translateY(-24px);
            padding: 10px 34px 12px; text-align: center; pointer-events: none;
            background: var(--panel-solid); border: 1px solid var(--line);
            border-top: 2px solid var(--amber); border-radius: 8px;
            box-shadow: var(--shadow);
            opacity: 0; transition: opacity .35s, transform .35s;
            white-space: nowrap; z-index: 10;
        }
        #achievement-title { color: var(--amber); font-size: 11px; letter-spacing: 6px; }
        #achievement-name { color: var(--text); font-size: 21px; font-weight: 600; letter-spacing: 2px; margin-top: 4px; }
        #achievement-desc { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
        #achievement-panel {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(640px, 94vw); max-height: 80%; overflow-y: auto;
            padding: 16px 22px; z-index: 11;
            background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px;
            box-shadow: var(--shadow); pointer-events: auto;
        }
        .ach-head {
            color: var(--blue); font-size: 14px; letter-spacing: 3px;
            margin-bottom: 10px; padding-bottom: 10px; text-align: center;
            border-bottom: 1px solid var(--line-soft);
        }
        .ach-row {
            display: flex; align-items: baseline; font-size: 13px;
            padding: 7px 2px; border-bottom: 1px solid rgba(42, 63, 95, .35);
        }
        .ach-row:last-child { border-bottom: none; }
        .ach-mark { width: 24px; flex: none; font-family: var(--mono); font-size: 11px; }
        .ach-name { width: 120px; flex: none; color: var(--text); }
        .ach-desc { flex: 1; color: var(--dim); }
        .ach-row.got .ach-mark { color: var(--green); }
        .ach-row.got .ach-desc { color: #9db4d0; }
        .ach-row.locked { color: #51637a; }
        .ach-row.locked .ach-name { color: #51637a; }

        /* ==================== 观战角标 ==================== */
        #spectator-badge {
            display: none; position: absolute; top: 50%; left: 20px;
            transform: translateY(-50%); z-index: 6;
            padding: 14px 7px; background: var(--panel);
            border: 1px solid rgba(255, 195, 92, .4); border-radius: 8px;
            box-shadow: var(--shadow); pointer-events: none;
            color: var(--amber); font-size: 13px; letter-spacing: 6px;
            writing-mode: vertical-rl;
        }

        /* ==================== 键位帮助（右下角 ? 展开，纯 CSS） ==================== */
        #controls-toggle { position: absolute; opacity: 0; pointer-events: none; }
        #controls-fab {
            position: absolute; right: 208px; bottom: 16px; z-index: 9;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            background: var(--panel); border: 1px solid var(--line); border-radius: 50%;
            box-shadow: var(--shadow); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            color: var(--dim); font-size: 15px; cursor: pointer; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #controls-fab:hover { color: var(--text); border-color: var(--blue); }
        #controls {
            position: absolute; right: 208px; bottom: 56px; z-index: 9;
            display: none; width: 336px; max-width: calc(100vw - 24px);
            padding: 14px 16px;
            background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px;
            box-shadow: var(--shadow); pointer-events: auto;
        }
        #controls-toggle:checked ~ #controls-fab { color: var(--text); border-color: var(--blue); background: rgba(74, 144, 217, .2); }
        #controls-toggle:checked ~ #controls { display: block; }
        #controls ul {
            list-style: none; margin: 0; padding: 0;
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px;
        }
        #controls li { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9db4d0; white-space: nowrap; }
        #controls li.span2 { grid-column: 1 / -1; }
        #controls kbd {
            font-family: var(--mono); font-size: 11px; color: var(--text);
            background: rgba(74, 144, 217, .12); border: 1px solid var(--line);
            border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; flex: none;
        }
        #controls .ctl-note {
            margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft);
            display: flex; align-items: center; gap: 8px;
            font-size: 11.5px; color: var(--dim); font-family: var(--mono);
        }
        #controls .ctl-note .dash { display: inline-block; width: 22px; border-top: 2px dashed var(--blue); }

        /* ==================== 触控按键（结构/位置固定，只换皮） ==================== */
        #touch-controls { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 8; }
        #touch-controls .pad { position: absolute; display: flex; gap: 8px; flex-wrap: wrap; width: 184px; }
        #touch-controls .pad-left { left: 12px; bottom: 12px; }
        #touch-controls .pad-right { right: 12px; bottom: 12px; justify-content: flex-end; }
        .tbtn {
            pointer-events: auto; touch-action: none;
            min-width: 86px; padding: 15px 14px;
            font-family: var(--sans); font-size: 14px; color: var(--text);
            background: rgba(13, 22, 38, .78);
            border: 1px solid var(--line); border-radius: 10px;
            box-shadow: var(--shadow); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            -webkit-tap-highlight-color: transparent;
            user-select: none; cursor: pointer;
        }
        .tbtn.small { min-width: 54px; padding: 9px 7px; font-size: 12px; color: var(--dim); }
        .tbtn.wide { flex: 1 1 100%; min-width: 0; }
        .tbtn.active { background: rgba(74, 144, 217, .9); border-color: #6ba6e0; color: #fff; }
        #t-ignite {
            padding: 17px 10px; font-size: 16px;
            border-color: rgba(255, 195, 92, .5); color: var(--amber);
            background: rgba(46, 32, 10, .8);
        }
        #t-ignite.active { background: var(--amber); border-color: var(--amber); color: #241a04; }

        /* ==================== 窄屏 / 矮屏 ==================== */
        @media (max-width: 760px) {
            /* 竖排按钮会占到 ~120px 高，数据面板往下让位 */
            #top-left { top: 124px; }
            .sys-btn { padding: 5px 9px; font-size: 11px; }
            .metric .val { font-size: 20px; }
        }
        @media (max-width: 460px) {
            #touch-controls .pad { width: 150px; gap: 6px; }
            .tbtn { min-width: 70px; padding: 11px 8px; font-size: 12px; }
            .tbtn.small { min-width: 44px; padding: 7px 3px; font-size: 11px; }
            #t-ignite { padding: 13px 8px; font-size: 15px; }
            .sys-row { max-width: calc(100vw - 20px); }
            #controls-fab, #controls { right: 174px; }
        }
        /* 屏幕矮的时候（横屏手机）：面板压紧，油门/燃料条挪到底部中间两侧，
           左右下角让给触控垫；键位帮助直接收起（触控用户用不到键盘） */
        @media (max-height: 620px) {
            #top-left { top: 96px; }
            #hud { font-size: 11px; line-height: 1.5; width: calc(100vw - 20px); }
            .sys-row { flex-wrap: nowrap; }
            #throttle-bar { left: calc(50% - 48px); bottom: 14px; height: 120px; }
            #fuel-bar { left: calc(50% + 28px); bottom: 14px; height: 120px; }
            #throttle-bar::after, #fuel-bar::after {
                background: repeating-linear-gradient(to top,
                    transparent 0 29px, rgba(220, 232, 247, .16) 29px 30px);
            }
            #throttle-text { left: calc(50% - 120px); width: 112px; text-align: right; bottom: 142px; }
            #fuel-text { left: calc(50% + 58px); right: auto; width: 260px; text-align: left; bottom: 142px; }
            #controls-fab, #controls { display: none; }
            .tbtn { min-width: 68px; padding: 11px 8px; font-size: 13px; }
            .tbtn.small { min-width: 48px; padding: 7px 4px; font-size: 11px; }
            #t-ignite { padding: 13px 8px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <canvas id="game" width="1000" height="700"></canvas>

    <!-- 左上：飞行数据（分层玻璃面板）+ 部件栏。
         #hud 只承载观战端的「等待操控端连接...」消息（main.js 写 innerText），
         观战端等待消息写这里；:empty 时空行自动隐藏。 -->
    <div id="top-left">
        <div id="hud"></div>
        <div id="parts-bar"></div>
    </div>

    <!-- 左右竖条：填充由 JS 写内联样式，容器/刻度/边框在这里 -->
    <div id="throttle-bar"><div id="throttle-fill"></div></div>
    <div id="throttle-text">油门 100%</div>
    <div id="fuel-bar"><div id="fuel-fill"></div></div>
    <div id="fuel-text">燃料 100%</div>

    <!-- 成就横幅（JS 设 opacity/transform）与成就列表 -->
    <div id="achievement">
        <div id="achievement-title">成 就 达 成</div>
        <div id="achievement-name"></div>
        <div id="achievement-desc"></div>
    </div>
    <div id="achievement-panel"></div>

    <!-- 观战角标（竖排，JS 控制显示） -->
    <div id="spectator-badge">观 战 中</div>

    <!-- 键位说明：默认收起，点右下角 ? 展开（纯 CSS checkbox 方案，无 JS） -->
    <input type="checkbox" id="controls-toggle">
    <label id="controls-fab" for="controls-toggle">?</label>
    <div id="controls">
        <ul>
            <li><kbd>E</kbd>点火/关机</li>
            <li><kbd>A D</kbd>旋转</li>
            <li><kbd>↑↓</kbd>油门(Shift 微调)</li>
            <li><kbd>[ ]</kbd>缩放</li>
            <li class="span2"><kbd>+</kbd>加油 / <kbd>-</kbd>卸油(要着陆)</li>
            <li><kbd>空格</kbd>分离</li>
            <li><kbd>S</kbd>存档</li>
            <li><kbd>L</kbd>读档</li>
            <li><kbd>C</kbd>成就</li>
            <li><kbd>M</kbd>音乐</li>
        </ul>
        <div class="ctl-note"><i class="dash"></i>蓝色虚线 = 预测轨道</div>
    </div>

    <!-- 右上：时间倍率胶囊 + 系统按钮 -->
    <div id="top-buttons">
        <div id="time-btn">
            <button id="time-down" title="减速（,）">−</button>
            <div id="time-value">1x</div>
            <button id="time-up" title="加速（.）">+</button>
        </div>
        <div class="sys-row">
            <button class="sys-btn" onclick="saveGame()">
                <svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M8 4v5h7V4"/><rect x="8" y="13" width="8" height="7"/></svg>存档</button>
            <button class="sys-btn" onclick="loadGame()">
                <svg viewBox="0 0 24 24"><path d="M12 14V4"/><path d="M8 8l4-4 4 4"/><path d="M4 16v4h16v-4"/></svg>读档</button>
            <button class="sys-btn" onclick="toggleAchievementPanel()">
                <svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4a3 3 0 0 0 3 4"/><path d="M17 5h3a3 3 0 0 1-3 4"/><path d="M12 14v4"/><path d="M8 21h8"/></svg>成就</button>
            <button class="sys-btn" onclick="toggleBgm()">
                <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="15" r="2.5"/></svg>音乐</button>
            <button class="sys-btn" onclick="showCoopInfo()">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>协同</button>
            <button class="sys-btn" onclick="toggleTouchPanel()">
                <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18h2"/></svg>触控</button>
        </div>
    </div>

    <!-- 触控按键：按下 = 按下对应的键，和键盘走同一套逻辑 -->
    <div id="touch-controls">
        <div class="pad pad-left">
            <button class="tbtn small" id="t-zoom-out">缩小</button>
            <button class="tbtn small" id="t-zoom-in">放大</button>
            <button class="tbtn small" id="t-fine">微调</button>
            <button class="tbtn small" id="t-vessel">切船</button>
            <button class="tbtn" id="t-left">◀ 左转</button>
            <button class="tbtn" id="t-right">右转 ▶</button>
            <button class="tbtn wide" id="t-sep">分离</button>
